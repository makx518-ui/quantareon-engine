name: clean-dubl

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: remove duplicate folder
        run: |
          if [ -d "knowledge/knowledge" ]; then
            git rm -r --quiet knowledge/knowledge
            echo "removed"
          else
            echo "nothing to remove"
            exit 0
          fi

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "remove duplicate knowledge folder"
          git push
