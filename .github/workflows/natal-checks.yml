name: Natal regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install calculation and HTTP test dependencies
        run: python -m pip install 'pyswisseph==2.10.3.2' 'fastapi>=0.104.0' 'pytz>=2023.3' 'geopy>=2.4.0' 'httpx>=0.25.0' 'python-multipart>=0.0.6'
      - name: Check calculation, confirmation, queue and delivery
        run: python tests/run_natal_checks.py
      - name: Check browser input handling
        run: node tests/test_geo_form.cjs
