<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Квантареон — проверка поиска места</title>
<style>body{background:#11152b;color:#eef0fa;font:17px/1.5 system-ui;margin:0}main{max-width:900px;margin:35px auto;padding:22px}h1{font-size:28px}.muted{color:#bac2db}form{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block}input,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #657096}input{background:#1b2340;color:white;width:100%;box-sizing:border-box}button{background:#d8bc6c;color:#161b31;cursor:pointer}button:disabled{opacity:.5;cursor:default}.wide{grid-column:1/-1}.card{background:#202942;border:1px solid #647093;padding:17px;margin:16px 0;border-radius:12px}.change{background:#403721;color:#fff0c6;padding:14px;border-radius:8px}.choice{width:auto;margin-right:10px}#status{padding:15px 0}a{color:#9ec7ff}iframe{width:100%;height:220px;border:0;margin:12px 0}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:650px){form{grid-template-columns:1fr}.wide{grid-column:auto}main{margin:10px auto}}</style>
<main><p class="muted">ПРОВЕРКА ПОИСКА · карта и заказ не создаются</p><h1>Найдём ваше место рождения</h1>
<p>Введите известный вам адрес. Старое название района можно оставить — покажем нынешний адрес найденных мест и попросим подтверждение.</p>
<form id="form"><label>Населённый пункт<input id="place" required placeholder="Советское"></label><label>Страна или территория<input id="country" list="countries" required placeholder="Казахстан"><datalist id="countries"></datalist></label>
<label>Область, если известна<input id="region" placeholder="Северо-Казахстанская область"></label><label>Район, в том числе прежний<input id="district" placeholder="Возвышенский район"></label>
<label>Дата рождения<input id="date" type="date" required></label><label>Местное время рождения<input id="time" type="time"><small class="muted">Если неизвестно, оставьте пустым.</small></label><button class="wide" id="search">Найти место</button></form>
<div id="status" role="status" aria-live="polite"></div><section id="results"></section><button id="confirm" hidden disabled>Да, это моё место рождения</button><section id="final"></section></main>
<script>
const $=id=>document.getElementById(id);let version=0,response=null,selected=null;
function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function polarNotice(latitude,timeKnown){
 if(Math.abs(Number(latitude))<=66.5)return '';
 const text=timeKnown?'Заполярные координаты: на этой широте дома карты рассчитываются по Региомонтану вместо Плацида. Меняется система домов карты.':'Заполярные координаты. Время рождения неизвестно: строится космограмма без домов и углов, поэтому переход на другую систему домов не требуется.';
 return '<p class="change" role="note">'+escape(text)+'</p>';
}
function reset(){version++;response=null;selected=null;$('results').replaceChildren();$('final').replaceChildren();$('confirm').hidden=true;$('confirm').disabled=true;$('status').textContent='Данные изменены. Найдите место заново.';$('search').disabled=false;}
for(const id of ['place','country','region','district','date','time'])$(id).addEventListener('input',reset);
fetch('/api/location-check/countries').then(r=>r.json()).then(names=>{$('countries').innerHTML=names.map(n=>'<option value="'+escape(n)+'"></option>').join('');});
$('form').addEventListener('submit',async e=>{e.preventDefault();const current=++version;response=null;selected=null;$('results').replaceChildren();$('final').replaceChildren();$('confirm').hidden=true;$('confirm').disabled=true;$('search').disabled=true;$('status').textContent='Проверяю место по мировым справочникам. При сбое связи повторю запрос самостоятельно…';
try{const r=await fetch('/api/location-check/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(['place','country','region','district'].map(id=>[id,$(id).value])))});const d=await r.json();if(current!==version)return;$('status').textContent=d.message;if(!d.candidates)return;response=d;
for(const c of d.candidates){const card=document.createElement('div');card.className='card';const map='https://www.openstreetmap.org/?mlat='+c.latitude+'&mlon='+c.longitude+'#map=13/'+c.latitude+'/'+c.longitude;
card.innerHTML='<label><input class="choice" type="radio" name="candidate" value="'+escape(c.id)+'">'+escape(c.address)+'</label><p class="muted">'+escape(c.latitude)+' / '+escape(c.longitude)+'</p>'+polarNotice(c.latitude,Boolean($('time').value))+c.changes.map(t=>'<p class="change">'+escape(t)+'</p>').join('')+'<a target="_blank" rel="noopener" href="'+escape(map)+'">Посмотреть это место на карте</a>';
card.querySelector('input').addEventListener('change',()=>{version++;selected=c.id;$('confirm').hidden=false;$('confirm').disabled=false;$('final').replaceChildren();$('status').textContent='Место выбрано. Подтвердите выбор.';});$('results').append(card);}
if(d.warnings?.length){const p=document.createElement('p');p.textContent=d.warnings.join(' ');$('results').append(p);}$('confirm').hidden=false;
}catch(e){if(current===version)$('status').textContent='Связь прервалась. Введённые данные сохранены; повторите поиск.';}finally{if(current===version)$('search').disabled=false;}});
$('confirm').addEventListener('click',async()=>{if(!response||!selected)return;const current=version;$('confirm').disabled=true;$('status').textContent='Проверяю исторический часовой пояс…';try{const r=await fetch('/api/location-check/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:response.token,selected,date:$('date').value,birth_time:$('time').value})});const d=await r.json();if(current!==version)return;$('status').textContent=d.message;if(d.status==='confirmed'){$('final').innerHTML='<div class="card"><h2>Место подтверждено</h2><p>'+escape(d.address)+'</p><p>'+escape(d.latitude)+' / '+escape(d.longitude)+(d.time_known?' · GMT':' · Справочный GMT на дату (12:00): ')+(d.gmt>=0?'+':'')+escape(d.gmt)+'</p><p>'+(!d.time_known?'Время неизвестно: в настоящем расчёте нужна космограмма без домов и углов.':'Местное время рождения сохранено.')+'</p>'+polarNotice(d.latitude,d.time_known)+'<p class="muted">Это тест поиска. Гороскоп, оплата и отправка писем здесь не запускаются.</p></div>';$('confirm').hidden=true;}}catch(e){if(current===version)$('status').textContent='Подтверждение не завершено из-за связи. Повторите попытку.';}finally{if(current===version)$('confirm').disabled=false;}});
</script></html>
