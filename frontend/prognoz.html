<script>
var QAPI=(location.protocol==='file:'?'http://localhost:8000':location.origin),TH='dark-high-contrast',timerOn=true,ti=null,li=null,natal=null,mode='natal';
function pInt(v){var n=parseInt(v,10);return isNaN(n)?null:n}
function gI(){var d=(document.getElementById('dt').value||'').split(/[.\-\/]+/),t=(document.getElementById('tm').value||'').split(/[.:\s]+/);return{year:pInt(d[2]),month:pInt(d[1]),day:pInt(d[0]),hour:pInt(t[0])||0,minute:pInt(t[1])||0,second:pInt(t[2])||0,timezone:parseFloat(document.getElementById('tz').value)||0,timezone_str:(document.getElementById('pl').dataset.tz||null),latitude:parseFloat(document.getElementById('la').value),longitude:parseFloat(document.getElementById('lo').value)}}
function chkI(d){if(d.year==null||d.month==null||d.day==null)return'Впиши дату рождения в формате ДД.ММ.ГГГГ';if(isNaN(d.latitude)||isNaN(d.longitude))return'Нет координат — нажми 🔍 или впиши широту и долготу';return null}

    if (ц.length) части.push(ц.slice(0,2));
    if (ц.length>2) части.push(ц.slice(2,4));
    if (ц.length>4) части.push(ц.slice(4,8));

  });
}
['дата_р','день'].forEach(id => маскаДаты($(id)));
$('день').addEventListener('change', ()=>обновитьСмещения());
$('дата_р').addEventListener('input', ()=>обновитьСмещения());

function годна(ч){
  // проверяем по-настоящему: 31.02 или 99.99.9999 не должны проходить молча
  if (ч.length!==3 || ч.some(isNaN)) return null;
  const [д,м,г] = ч;
  if (г<1800 || г>2200 || м<1 || м>12 || д<1 || д>31) return null;
  const дата = new Date(г, м-1, д);
  if (дата.getFullYear()!==г || дата.getMonth()!==м-1 || дата.getDate()!==д) return null;
  return дата;
}
function читатьДень(){
  const д = годна(($("день").value||'').split('.').map(Number));
  подсветить($("день"), !!д || !$("день").value);
  return д || new Date();
}
function писатьДень(д){
  $("день").value = String(д.getDate()).padStart(2,'0')+'.'+String(д.getMonth()+1).padStart(2,'0')+'.'+д.getFullYear();
}
function сдвигДня(н){ const д = читатьДень(); д.setDate(д.getDate()+н); писатьДень(д); обновитьСмещения(); }
function кСегодня(){ писатьДень(new Date()); if (typeof обновитьСмещения==='function') обновитьСмещения(); }

// ── города: та же база, что в мухурте; подгружается с сервера ──
let БАЗА = [];
const имяСтраны = (()=>{ try{ const d=new Intl.DisplayNames(["ru"],{type:"region"});
  return к => { try{ return d.of(к)||к; }catch(e){ return к; } }; }catch(e){ return к=>к; } })();

async function загрузитьГорода(){
  try{
    const r = await fetch('/cities.json');
    if (!r.ok) throw new Error('нет файла городов');
    БАЗА = await r.json();
  }catch(e){ $("статус").textContent = 'города не загрузились ('+e.message+') — впиши координаты руками'; return; }
  const коды = [...new Set(БАЗА.map(г=>г[0]))].map(к=>[к,имяСтраны(к)])
                .sort((a,b)=>a[1].localeCompare(b[1],"ru"));
  ["страна_р","страна_с"].forEach(id=>{
    коды.forEach(([к,имя])=>{ const o=document.createElement("option"); o.value=к; o.textContent=имя; $(id).appendChild(o); });
  });
  // сперва вспоминаем прошлый выбор, и только если его нет — ставим по поясу браузера
  if (!вспомнить()) поставитьПоПоясу();
}

function городаСтраны(код){
  return БАЗА.map((г,и)=>[г,и]).filter(([г])=>г[0]===код)
             .sort((a,b)=>a[0][1].localeCompare(b[0][1],"ru"));
}
function заполнить(комбо, код, выбрать){
  const свои = городаСтраны(код);
  $(комбо).innerHTML = "";
  свои.forEach(([г,и])=>{ const o=document.createElement("option"); o.value=и; o.textContent=г[1]; $(комбо).appendChild(o); });
  if (выбрать!==undefined) $(комбо).value = выбрать;
  return свои;
}
function поставитьГород(набор, и){
  const [к,имя,ш,д,з] = БАЗА[и];
  setTimeout(запомнить, 0);
  $("страна_"+набор).value = к; заполнить("город_"+набор, к, и);
  $("шир_"+набор).value = ш; $("долг_"+набор).value = д;
  $("gmt_"+набор).dataset.зона = з;                       // помним зону
  // без даты рождения смещение считать не от чего — ставим прочерк, а не чужой день
  if (набор === "р" && !датаРождения()){
    $("gmt_р").value = ""; $("gmt_р").placeholder = "нужна дата";
  } else {
    $("gmt_"+набор).value = сдвигЗоны(з, набор==="с" ? читатьДень() : датаРождения());
  }
  if (набор === "с") подписьМеста();
}
function датаРождения(){
  const д = годна(($("дата_р").value||'').split('.').map(Number));
  подсветить($("дата_р"), !!д || !$("дата_р").value);

}
function подсветить(поле, хорошо){

// при смене дня пересчитываем смещение — вдруг в тот год часы переводили иначе
function обновитьСмещения(){
  ["р","с"].forEach(н=>{
    const поле = $("gmt_"+н), зона = поле.dataset.зона;
    if (!зона) return;
    поле.value = сдвигЗоны(зона, н==="с" ? читатьДень() : датаРождения());
  });
  подписьМеста();
}
function подписьМеста(){
  const зона = $("gmt_с").dataset.зона;
  $("подпись_места").textContent = ручноеМесто
    ? (зона ? `место задано вручную · ${зона} · смещение на ${$("день").value}: GMT${$("gmt_с").value}` : "место задано вручную")
    : (зона ? `место по твоему поясу · ${зона}` : "");
}
function сдвигЗоны(зона, дата){
  try{
    // ⚠️ смещение считаем НА ВЫБРАННЫЙ ДЕНЬ: переводы часов и старые зоны
    // менялись, и для прошлых лет сегодняшнее смещение соврало бы на час-два
    const т = дата || читатьДень() || new Date();
    const ч = (new Date(т.toLocaleString("en-US",{timeZone:зона})) - new Date(т.toLocaleString("en-US",{timeZone:"UTC"})))/3600000;
    return (ч>=0?"+":"")+ (Math.round(ч*10)/10);
  }catch(e){ return ""; }
}
["р","с"].forEach(набор=>{

function поставитьПоПоясу(){

// ── место по спутнику: VPN и часовой пояс на него не влияют ──
function поСпутнику(){
  if (!navigator.geolocation){ $("статус").textContent = "браузер не умеет брать координаты"; return; }
  $("статус").textContent = "спрашиваю у устройства…";
  navigator.geolocation.getCurrentPosition(п=>{
    const ш = п.coords.latitude, д = п.coords.longitude;
    if (!ручноеМесто) переключитьМесто();
    let лучший = -1, мин = 1e9;
    БАЗА.forEach((г,и)=>{ const р=(г[2]-ш)**2 + ((г[3]-д)*Math.cos(ш*Math.PI/180))**2;
                          if (р<мин){ мин=р; лучший=и; } });
    if (лучший>=0) поставитьГород("с", лучший);
    $("шир_с").value = ш.toFixed(5); $("долг_с").value = д.toFixed(5);   // точные, не городские
    $("статус").textContent = `место со спутника: ${ш.toFixed(4)}, ${д.toFixed(4)}`
                            + (лучший>=0 ? ` · ближайший город ${БАЗА[лучший][1]}` : "");
    запомнить();
  }, о=>{ $("статус").textContent = "координаты не дались ("+о.message+") — выбери город вручную"; },
     {timeout:8000, maximumAge:600000});
}

// ── помним последний выбор: чтобы каждый раз не искать свой город заново ──
const КЛЮЧ = "квантареон-прогноз";
function запомнить(){
  try{
    const с = {ручное: ручноеМесто};
    ["имя","дата_р","шир_р","долг_р","gmt_р","страна_р","город_р",
     "шир_с","долг_с","gmt_с","страна_с","город_с"].forEach(id=>{ const э=$(id); if(э) с[id]=э.value; });
    с.зона_р = $("gmt_р").dataset.зона || ""; с.зона_с = $("gmt_с").dataset.зона || "";
    localStorage.setItem(КЛЮЧ, JSON.stringify(с));
  }catch(e){}
}
function вспомнить(){
  try{
    const с = JSON.parse(localStorage.getItem(КЛЮЧ)||"null");
    if (!с) return false;
    ручноеМесто = !!с.ручное;
    ["страна_р","страна_с"].forEach(id=>{ if(с[id]) { $(id).value=с[id]; заполнить(id.replace("страна","город"), с[id]); } });
    ["имя","дата_р","шир_р","долг_р","gmt_р","город_р","шир_с","долг_с","gmt_с","город_с"]
      .forEach(id=>{ const э=$(id); if(э && с[id]!==undefined) э.value=с[id]; });
    if (с.зона_р) $("gmt_р").dataset.зона = с.зона_р;
    if (с.зона_с) $("gmt_с").dataset.зона = с.зона_с;
    $("режим_места").textContent = ручноеМесто ? "✍️ где я был" : "📍 где я сейчас";
    if (ручноеМесто) $("режим_места").style.color = "#f0c040";
    обновитьСмещения();
    return true;
  }catch(e){ return false; }
}

function переключитьМесто(){
  ручноеМесто = !ручноеМесто;
  $("режим_места").textContent = ручноеМесто ? "✍️ где я был" : "📍 где я сейчас";
  $("режим_места").style.color = ручноеМесто ? "#f0c040" : "";

// ── космограмма: колесо, повёрнутое Солнцем на асцендент ──
async function построитьКосмограмму(){
  const ч = ($("дата_р").value||"").split(".").map(Number);
  const день = ($("день").value||"").split(".").map(Number);
  if (!годна(ч)){ $("статус").textContent = "впиши дату рождения"; return; }
  const ш = parseFloat($("шир_р").value), д = parseFloat($("долг_р").value);
  if (isNaN(ш)||isNaN(д)){ $("статус").textContent = "нет координат рождения"; return; }
  const gmt = parseFloat(($("gmt_р").value||"").replace(",", ".")) || 0;
  try{
    const r = await fetch("/day-cosmogram", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({year:ч[2], month:ч[1], day:ч[0], latitude:ш, longitude:д, gmt,
        // день и место «сейчас» — тогда Кериткеон строит ДВОЙНУЮ карту с транзитным кольцом
        t_year:день[2], t_month:день[1], t_day:день[0], t_hour:12, t_minute:0,
        t_lat:parseFloat($("шир_с").value), t_lon:parseFloat($("долг_с").value),
        t_gmt:parseFloat(($("gmt_с").value||"0").replace(",", ".")) || 0})});
    if (!r.ok){
      const причина = await разобратьОшибку(r);
      $("статус").innerHTML = `<span style="color:#e8202a">космограмма не построилась (HTTP ${r.status})`
        + (причина? ` · ${причина}` : ` · проверь, что залит свежий api/main.py`) + `</span>`;
      return;
    }
    const о = await r.json();
    document.getElementById("wh").innerHTML = о.svg;
    спрятатьДома();
    // колесо повёрнуто по Солнцу — от этого градуса считают все наши слои,
    // потому держим его на виду у всей страницы, а не в местной переменной
    window.поворотКолеса = о.солнце;
    window.солнцеКосмограммы = о.солнце;
    window.лунаКосмограммы = о.луна;
    window.двойная = !!о.двойная;
    // ⚠️ по этим двум признакам сразу видно, что на сервере лежит старый api/main.py
    if (!о.сборка || о.сборка !== СБОРКА_СТРАНИЦЫ){
      $("статус").innerHTML = `<span style="color:#e8202a">На сервере СТАРЫЙ api/main.py`
        + (о.сборка? ` (сборка ${о.сборка}, у страницы ${СБОРКА_СТРАНИЦЫ})` : ` (сборки нет вовсе)`)
        + ` — залей api/main.py и папку engine, потом нажми Shift+обновление</span>`;
    } else if (!о.двойная){
      $("статус").innerHTML = `<span style="color:#e8a04a">карта одинарная: транзитное кольцо не построилось`
        + ` — проверь, что залит свежий api/main.py</span>`;
    }
    $("подпись_карты").textContent = о.солнце_на_асценденте
      ? `Солнце на асценденте · солнечный час ${о.солнечный_час}`
      : `колесо на местный полдень — солнечного часа в этот день нет`;
    $("оговорка").textContent = о.оговорка;
    пятноВЦентре();
    $("статус").textContent = "космограмма построена · считаю круг суток…";
    await взятьСетку();
  }catch(e){ $("статус").textContent = "космограмма: " + e.message; }
}

// причину берём из detail, а если сервер ответил не JSON — показываем сырой текст
async function разобратьОшибку(r){
  let т = "";
  try { т = await r.text(); } catch(e){ return ""; }
  try { const j = JSON.parse(т); return typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); }
  catch(e){ return т.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0, 160); }
}

// ── сетка суток: весь круг одним ответом, дальше крутим в браузере ──

// ── показать любую минуту круга: веер, подпись, глава ──
function показатьМинуту(мин){
  // подсказки навешиваются прямо в атрибуты при рисовании — общий обработчик ниже
  const с = window.сетка; if (!с) return;
  const шаг = с.шаг_минут || 2;
  const и = Math.max(0, Math.min(с.сетка.length-1, Math.round(мин/шаг)));
  window.минута = и*шаг;
  // ⚠️ ВЕЕР, СТРЕЛУ, ЛУЧИ ЗНАКОВ И ГРАДУСЫ РИСУЕТ САМА КАРТА — свои не рисуем,
  // иначе выходит два веера и две буквы As с разными поворотами (так и было)
  вспышки(с.сетка[и].slice(1));
  двигатьПолзунок();
  рисоватьОчередь();
  const врем = времяМинуты(window.минута);
  const глава = с.главы.find(г => внутри(врем, г.начало, г.конец)) || с.главы[0];
  $("подпись_карты").textContent =
    `${врем} · глава ${глава.знак} (${глава.начало}–${глава.конец}) · Солнце на асценденте, солнечный час ${с.солнечный_час}`;
}
function времяМинуты(мин){
  const [ч,м,к] = (window.сетка.начало||"00:00:00").split(":").map(Number);
  const всего = (ч*60+м+мин) % 1440;
  return String(Math.floor(всего/60)).padStart(2,"0")+":"+String(всего%60).padStart(2,"0");
}
function внутри(врем, от, до){
  const м = т => { const [a,b] = т.split(":").map(Number); return a*60+b; };
  const т=м(врем), a=м(от), b=м(до);
  return a<=b ? (т>=a && т<b) : (т>=a || т<b);
}

// ── шкала суток: засечки узлов, ползунок текущей минуты ──
function рисоватьШкалу(){
  const с = window.сетка, ш = $("шкала"); if (!с || !ш) return;
  ш.innerHTML = "";
  // главы полосами
  с.главы.forEach((г,и)=>{
    const от = минутаОт(г.начало), до = минутаОт(г.конец);
    const ширина = ((до-от+1440)%1440 || 1440)/1440*100;
    const д = document.createElement("div");
    д.style.cssText = `position:absolute;left:${от/1440*100}%;width:${ширина}%;top:0;bottom:0;
      background:${и%2? "rgba(240,192,64,.05)":"rgba(240,192,64,.10)"};border-right:1px solid #2a2d42`;
    д.title = `${г.знак} · ${г.начало.slice(0,5)}–${г.конец.slice(0,5)} · ${г.минут} мин`;
    д.setAttribute("data-tip", `<b>${г.знак}</b> · ${г.начало.slice(0,5)}–${г.конец.slice(0,5)} · ${г.минут} мин`);
    ш.appendChild(д);
    const п = document.createElement("div");
    п.style.cssText = `position:absolute;left:${от/1440*100}%;top:2px;font-size:8px;color:#8a93b5;padding-left:3px`;
    п.textContent = г.знак.slice(0,3);
    ш.appendChild(п);
  });
  // засечки узлов
  с.узлы.forEach(у=>{
    const з = document.createElement("div");
    const угловой = у.угол === "Асцендент";
    з.style.cssText = `position:absolute;left:${у.минута/1440*100}%;bottom:0;width:1px;
      height:${угловой?16:10}px;background:${угловой? "#ff4040":"#a03040"};opacity:.9`;
    з.setAttribute("data-tip", `<b>${у.время.slice(0,5)} · ${у.угол}</b> → ${у.точка} · ${у.градус_текст}`);
    ш.appendChild(з);
  });
  // ползунок
  const п = document.createElement("div"); п.id = "ползунок";
  п.style.cssText = "position:absolute;top:0;bottom:0;width:2px;background:#f0c040;box-shadow:0 0 6px #f0c040";
  ш.appendChild(п);
  ш.onclick = e => {
    const r = ш.getBoundingClientRect();
    показатьМинуту(Math.round((e.clientX-r.left)/r.width*1440));
  };
  двигатьПолзунок();
}
function минутаОт(врем){
  const с = window.сетка; if (!с) return 0;
  // ⚠️ считаем В СЕКУНДАХ: без них узел конца круга (15:22:47 при начале 15:22:51)
  // получал минуту 0 и попадал в первую главу вместо последней
  const сек = т => { const [a,b,c] = т.split(":").map(Number); return a*3600 + b*60 + (c||0); };
  const d = ((сек(врем) - сек(с.начало)) % 86400 + 86400) % 86400;
  return Math.floor(d / 60);
}
function двигатьПолзунок(){
  const п = document.getElementById("ползунок"); if (!п) return;
  п.style.left = (window.минута/1440*100) + "%";
  const с = window.сетка;
  if (с) $("шкала_подпись").textContent =
    `${времяМинуты(window.минута)} · ${window.минута} минута круга из 1440 · узлов ${с.узлы.length}`;
}

// ── очередь ближайших узлов с обратным отсчётом ──
function рисоватьОчередь(){
  const с = window.сетка, о = $("очередь"); if (!с || !о) return;
  const впереди = с.узлы
    .map(у => ({...у, через: ((у.минута - window.минута) % 1440 + 1440) % 1440}))
    .sort((a,b) => a.через - b.через).slice(0, 8);
  о.innerHTML = впереди.map(у=>{
    const скоро = у.через <= 15;
    return `<div style="border:1px solid ${скоро?"#8a3040":"#2a2d42"};border-radius:5px;padding:5px 8px;
      background:${скоро?"rgba(232,32,42,.10)":"#11141f"};cursor:pointer" onclick="показатьМинуту(${у.минута})"
      data-tip="<b>${у.угол} → ${у.точка}</b> · ${у.градус_текст} · окно ${у.окно_минут} мин">
      <span style="color:${скоро?"#ff6060":"#7fb0ff"};font-weight:600">${у.через===0?"сейчас":"через "+у.через+" мин"}</span>
      <span style="color:#8a93b5"> · ${у.время.slice(0,5)}</span><br>
      <span style="font-size:10px">${у.угол.split(" ")[0]} → ${у.точка.replace("натальный","нат.").replace("транзитный","тр.")}</span>
      <span style="font-size:10px;color:#6a7290"> · ${у.градус_текст}</span></div>`;
  }).join("");
}

// ── ПОЛОЧКА ТЕКСТОМ: то, что пойдёт в трактовку ──
function собратьПолочку(){
  const с = window.сетка; if (!с) return "";
  const л = [], имя = ($("имя").value||"человек");
  const ч = "═".repeat(74);
  л.push(ч, `ПОЛОЧКА МАШИНЫ · ${имя} · день ${$("день").value}`, ч);
  л.push(`место: ${$("шир_с").value}, ${$("долг_с").value} · GMT${$("gmt_с").value}`);
  л.push(`рождение: ${$("дата_р").value} · ${$("шир_р").value}, ${$("долг_р").value} · GMT${$("gmt_р").value}`);
  л.push(`круг: от градуса асцендента ${дмс(с.якорь)}, начало ${с.начало}, 24 часа`);
  л.push(`космограмма построена на солнечный час ${с.солнечный_час}`
        + (с.солнце_на_асценденте ? " (Солнце на асценденте)" : " (солнечного часа нет — местный полдень)"));
  // космограмма построена НА СОЛНЕЧНЫЙ ЧАС — значит и Луна стоит там, где стояла
  // в этот момент. Это её законное место в этой карте, а не приближение
  const лн = (с.точки && с.точки["натальный Луна"] !== undefined) ? с.точки["натальный Луна"] : null;
  if (лн !== null) л.push(`Луна космограммы: ${дмс(лн)} — на солнечный час ${с.солнечный_час}`);

  const кж = с.колесо_жизни;
  л.push("", "╔══ КОЛЕСО ЖИЗНИ — стержень ══");
  л.push(`  стоит на ${кж.текст} · ${кж.эпоха}-я эпоха (годы ${кж.годы[0]}–${кж.годы[1]})`);
  const аспКолеса = (кж.аспекты || []);
  if (аспКолеса.length){
    л.push("  ── его аспекты (орбис жёстко 1°: планеты, Селена, Чёрная Луна, Хирон, узлы)");
    аспКолеса.forEach(а=> л.push(`     ${а.аспект.padEnd(11)} ${а.к.padEnd(22)} орб ${а.орбис}°`));
  } else {
    л.push("  аспектов в орбисе 1° сейчас нет");
  }

  if (с.фаза_луны) л.push("", "╔══ ФАЗА СУТОК ══",
    `  ${с.фаза_луны.имя} (${с.фаза_луны.угол}°) — ${с.фаза_луны.смысл}`);

  const к = с.космограмма;
  if (к){
    л.push("", "╔══ КОСМОГРАММА — изнутри наружу, без домов ══");
    к.слои.forEach(сл=>{
      л.push(`  ── ${сл.слой}`);
      сл.точки.forEach(т=> л.push(`     ${т.имя.padEnd(10)} ${т.текст}`));
    });
    л.push(`  стихии: ${Object.entries(к.стихии).map(([а,б])=>а+" "+б).join(" · ")}`);
    л.push(`  кресты: ${Object.entries(к.кресты).map(([а,б])=>а+" "+б).join(" · ")}`);
    л.push("", "  ── АСПЕКТЫ КОСМОГРАММЫ (орбисы 6/5/4)");
    к.аспекты.forEach(а=> л.push(`     ${а.а.padEnd(10)} ${а.аспект.padEnd(11)} ${а.б.padEnd(10)} орб ${а.орбис}°${а.точный?"  ← точный":""}`));
  }

  const м = с.медленные;
  if (м){
    л.push("", "╔══ ПРИЧИННЫЙ СЛОЙ — за сутки не движется ══");
    л.push(`  солнечная дуга ${м.дуга}° · возраст ${м.лет} лет`);
    л.push("  ── дирекции");
    м.дирекции.forEach(т=> л.push(`     дир.${т.имя.padEnd(10)} ${т.текст}`));
    л.push("  ── прогрессии");
    м.прогрессии.forEach(т=> л.push(`     прог.${т.имя.padEnd(10)} ${т.текст}`));
    л.push("  ── связи причинного слоя с космограммой (орб 1°, к транзитам не ведём)");
    м.аспекты.forEach(а=> л.push(`     ${а.слой}.${а.точка.padEnd(9)} ${а.аспект.padEnd(11)} ${а.к.padEnd(22)} орб ${а.орбис}°`
                                 + (а.орбис <= 0.5 ? "  ← точный" : "")));
  }

  const о = с.окно_медитации;
  л.push("", "╔══ РЕЖИМЫ СУТОК ══");
  if (о && о.начало) л.push(`  восход ${о.восход} · закат ${о.закат} · ◇ окно медитации ${о.начало}–${о.конец}`);
  else л.push(`  ${о && о.нет ? о.нет : "окна медитации нет"}`);

  л.push("", `╔══ ГЛАВЫ КРУГА (${с.главы.length}) ══`);
  с.главы.forEach((г,и)=>{
    // ⚠️ глава может переваливать через начало круга — сравнивать надо по кольцу,
    // иначе один узел выпадает (ловил на прогоне: 119 из 120)
    const от = минутаОт(г.начало), до = минутаОт(г.конец);
    // ⚠️ по СЕКУНДАМ: по округлённой минуте узел 19:12:07 попадал в главу,
    // начинающуюся в 19:12:33 — то есть раньше её начала
    const вСек = т => { const [a,b,c] = т.split(":").map(Number); return a*3600+b*60+(c||0); };
    const нач0 = вСек(с.начало);
    const сдвиг = т => ((вСек(т) - нач0) % 86400 + 86400) % 86400;
    const отС = сдвиг(г.начало), доС = сдвиг(г.конец);
    const свои = с.узлы.filter(у=>{
      const s = сдвиг(у.время);
      return отС <= доС ? (s >= отС && s < доС) : (s >= отС || s < доС);
    });
    свои.sort((a,b)=>сдвиг(a.время)-сдвиг(b.время));
    л.push("", `  ГЛАВА ${и+1}. ${г.знак.toUpperCase()} · ${г.начало}–${г.конец} · ${г.минут} мин`
              + (г.неполная ? ` · ${г.неполная}` : "")
              + ` · режим ${режимГлавы(г, о)}`);
    if (!свои.length) л.push("     узлов нет — тихий отрезок");
    свои.forEach(у=> л.push(`     ${у.время}  ${у.угол.split(" ")[0].padEnd(12)} → ${имяТочки(у.точка).padEnd(20)} ${у.градус_текст}  окно ${у.окно_минут} мин`
                            + (у.повтор ? "  ↺ повтор хвоста круга" : "")));
  });
  л.push("", ч, `узлов за круг: ${с.узлы.length} · глав: ${с.главы.length}`, ч);
  return л.join("\n");
}

// режим целой главы: если окно медитации попадает внутрь — это пограничье,
// даже когда сама глава началась ночью
// в полочке имена точек такие же, как в подписях на карте
function имяТочки(ключ){
  return String(ключ).replace(/^натальный\s+/, "косм. ").replace(/^транзитный\s+/, "транз. ");
}

function режимГлавы(г, окно){
  const базовый = режимОтрезка(г.начало, окно);
  if (!окно || !окно.начало) return базовый;
  const от = минутаОт(г.начало), до = минутаОт(г.конец);
  const м = минутаОт(окно.начало + ":00");
  const внутри = от <= до ? (м >= от && м < до) : (м >= от || м < до);
  return внутри ? `◇ пограничье — окно медитации ${окно.начало}–${окно.конец} внутри главы` : базовый;
}

function режимОтрезка(врем, окно){
  if (!окно || !окно.восход) return "☀/☾ неизвестен";
  const м = т => { const [a,b] = т.split(":").map(Number); return a*60+b; };
  const т = м(врем), в = м(окно.восход), з = м(окно.закат);
  if (окно.начало && т >= м(окно.начало) && т < м(окно.конец)) return "◇ пограничье (мухурта)";
  return (т >= в && т < з) ? "☀ день — сознание" : "☾ ночь — подсознание";
}

function показатьПолочку(){
  const т = собратьПолочку();
  $("полочка").textContent = т;
  ["карта_шкала","карта_очередь","карта_полочка"].forEach(id=> $(id).style.display="");
}

function сохранитьПолочку(){
  const т = $("полочка").textContent;
  const blob = new Blob([т], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `полочка ${($("имя").value||"человек")} ${$("день").value}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  $("статус").textContent = "полочка сохранена файлом";
}

// ── живой режим: асцендент бежит сам, веер и вспышки идут за реальной минутой ──
window.живаяМинута = null;


function кСейчас(){
  const с = window.сетка; if (!с) return;
  if (window.бег){ clearInterval(window.бег); window.бег = null; }
  const т = new Date();
  const м = т.getHours()*60 + т.getMinutes();
  const [ч0,м0] = с.начало.split(":").map(Number);
  показатьМинуту(((м - (ч0*60+м0)) % 1440 + 1440) % 1440);
  $("статус").textContent = "вернулись на текущую минуту";
}

// ── кручение суток красной точкой в центре ──
function крутить(направление){
  const куда = (направление === -1) ? -1 : 1;
  // уже крутится: та же стрелка — стоп, другая — разворот
  if (window.бег){
    clearInterval(window.бег); window.бег = null;
    подсветитьКнопки(0);
    if (window.куда === куда){
      $("статус").textContent = "остановлено на " + времяМинуты(window.минута);
      return;
    }
  }
  if (!window.сетка){ $("статус").textContent = "сперва рассчитай день"; return; }
  window.куда = куда;
  // ⚠️ СКОРОСТЬ: один знак ≈ 30 секунд. Средний знак — два часа круга,
  // значит идём 4 минуты круга в секунду: тик раз в 500 мс на 2 минуты.
  // Весь круг проходит за 6 минут; короткие знаки быстрее, длинные дольше — так и есть на небе.
  window.бег = setInterval(()=>{
    показатьМинуту((window.минута + 2*куда + 1440) % 1440);
  }, 500);
  подсветитьКнопки(куда);
  $("статус").textContent = (куда === 1 ? "крутим вперёд" : "крутим назад")
    + ": знак ≈ 30 секунд, круг ≈ 6 минут — нажми ту же стрелку, чтобы остановить";
}

function подсветитьКнопки(куда){
  const н = $("кнНазад"), в = $("кнВперёд");
  if (н) н.style.color = (куда === -1) ? "#f0c040" : "";
  if (в) в.style.color = (куда === 1) ? "#f0c040" : "";
}

// ═══════ НАШИ СЛОИ ПОВЕРХ КОСМОГРАММЫ ═══════
// Геометрия та же, что на карте: центр 240,240, поворот от градуса Солнца.
const ЦЕНТР = 240, R_ПЯТНО = 80, R_КОСМО = 168, R_ДОМА = 222, R_КРАЙ = 240;
const NS = "http://www.w3.org/2000/svg";
const ЗН_Р = ['Овна','Тельца','Близнецов','Рака','Льва','Девы','Весов','Скорпиона','Стрельца','Козерога','Водолея','Рыб'];

// ⚠️ ЕДИНЫЙ ОТСЧЁТ КАРТЫ: все наши слои считаются ЕЁ функцией degToScreen.
// Своей геометрии тут быть не должно — из-за неё и появлялся второй асцендент.
function наЭкран(градус, R){
  if (typeof degToScreen === "function") return degToScreen(градус, R);
  const у = (180 + градус) % 360, р = у * Math.PI/180;
  return [240 + R*Math.cos(р), 240 - R*Math.sin(р)];
}
function слой(имя){
  const свг = document.getElementById("wh").querySelector("svg"); if (!свг) return null;
  const цель = свг.querySelector('[transform*="translate(100"]') || свг;
  let г = свг.querySelector("#"+имя);
  if (г) г.remove();
  г = document.createElementNS(NS,"g"); г.setAttribute("id",имя); цель.appendChild(г);
  return г;
}
function эл(вид, атрибуты, текст){
  const э = document.createElementNS(NS, вид);
  for (const к in атрибуты) э.setAttribute(к, атрибуты[к]);
  if (текст !== undefined) э.textContent = текст;
  return э;
}

// ── медленные в белом пятне: дирекции и прогрессии со своими струнами ──
const ЦВЕТ_АСПЕКТА = {соединение:"rgba(255,255,255,.55)", секстиль:"#4fbf7a", трин:"#4fbf7a",
                      квадрат:"#e05555", оппозиция:"#e05555"};
const ЗНАЧКИ = {"Солнце":"☉","Луна":"☽","Меркурий":"☿","Венера":"♀","Марс":"♂","Юпитер":"♃",
                "Сатурн":"♄","Уран":"♅","Нептун":"♆","Плутон":"♇","Хирон":"⚷","Лилит":"⚸",
                "Селена":"⚜","Сев.Узел":"☊","Юж.Узел":"☋"};

const ЦВЕТ_ПЛАНЕТЫ = {
  "Солнце":"#f0c040","Луна":"#cfd6ff","Меркурий":"#6ed4b8","Венера":"#f08fc0","Марс":"#e85050",

function медленныеВЦентре(данные){
  const г = слой("медленные"); if (!г || !данные || !данные.медленные) return;
  const м = данные.медленные, R_ДИР = 62, R_ПРОГ = 38;
  const радиус = слой_ => слой_ === "дирекция" ? R_ДИР : R_ПРОГ;

  // ── струны: точные ярче и толще, у каждой помечено, чья она ──
  (м.аспекты||[]).forEach((а,и)=>{
    const свой = наЭкран(а.градус, радиус(а.слой));
    const цель = наЭкран(а.градус_цели, R_ПЯТНО - 4);
    const точный = а.орбис <= 0.5;
    const линия = эл("line",{x1:свой[0].toFixed(1), y1:свой[1].toFixed(1),
      x2:цель[0].toFixed(1), y2:цель[1].toFixed(1),
      stroke: ЦВЕТ_АСПЕКТА[а.аспект]||"rgba(255,255,255,.4)",
      "stroke-width": точный ? "1.6" : "0.8",
      opacity: точный ? "0.95" : "0.45",
      "data-струна": а.слой + " " + а.точка,
      "data-tip":`<b>${а.слой} ${а.точка}</b> ${а.аспект} ${а.к}`
                + ` · орбис ${а.орбис.toFixed(2)}°${точный?" · ТОЧНЫЙ":""} · сдвиг по жизни`});
    г.appendChild(линия);
  });

  // ── значки: цветные, крупные, с обводкой; при наведении подсвечивают свои струны ──
  [["дирекции", R_ДИР, 15, "дирекция"], ["прогрессии", R_ПРОГ, 12, "прогрессия"]].forEach(([ключ,R,размер,род])=>{
    (м[ключ]||[]).forEach(т=>{
      const п = наЭкран(т.градус, R);
      const цвет = ЦВЕТ_ПЛАНЕТЫ[т.имя] || "#cfd6ff";
      const свои = (м.аспекты||[]).filter(а=>а.точка===т.имя && а.слой===род);
      const дом = домТочки(т.градус);
      const подпись = `<b><span style="color:${цвет}">${т.имя} ${род==="дирекция"?"дир.":"прог."}</span></b>`
                    + ` · ${т.текст}${дом?` · ${дом} дом сейчас`:""}`
                    + (свои.length ? "<br>" + свои.map(а=>
                        `→ ${а.аспект} <b>${а.к.replace("космограмма ","косм. ")}</b> · орб ${а.орбис.toFixed(2)}°`
                      ).join("<br>") : "<br>связей нет");
      const узел = document.createElementNS(NS,"g");
      узел.setAttribute("data-tip", подпись);
      узел.setAttribute("data-имя", род + " " + т.имя);
      узел.style.cursor = "help";
      // светящаяся подложка, чтобы значок читался на тёмном
      узел.appendChild(эл("circle",{cx:п[0].toFixed(1), cy:п[1].toFixed(1), r:(размер*0.62).toFixed(1),
        fill:"#0b0e1a", opacity:"0.85"}));
      if (свои.some(а=>а.орбис<=0.5))
        узел.appendChild(эл("circle",{cx:п[0].toFixed(1), cy:п[1].toFixed(1), r:(размер*0.72).toFixed(1),
          fill:"none", stroke:цвет, "stroke-width":"1", opacity:"0.55"}));
      узел.appendChild(эл("text",{x:п[0].toFixed(1), y:п[1].toFixed(1), fill:цвет,
        "font-size":String(размер), "font-weight":"600",
        stroke:"#0a0c16", "stroke-width":"2.2", "paint-order":"stroke",
        "text-anchor":"middle", "dominant-baseline":"middle"}, ЗНАЧКИ[т.имя] || т.имя.slice(0,2)));
      узел.addEventListener("mouseover", ()=>подсветитьСтруны(род + " " + т.имя, цвет));
      узел.addEventListener("mouseout", ()=>подсветитьСтруны(null));

  г.appendChild(эл("text",{x:ЦЕНТР, y:ЦЕНТР+R_ПЯТНО-8, fill:"rgba(255,255,255,.32)","font-size":"7",
    "text-anchor":"middle"}, `дирекции · прогрессии · дуга ${(м.дуга||0).toFixed(2)}° · ${(м.лет||0).toFixed(1)} лет`));

// подсветка: наведи на планету — загорятся её струны, остальные притухнут
function подсветитьСтруны(имя, цвет){
  const свг = document.getElementById("wh") && document.getElementById("wh").querySelector("svg");
  if (!свг) return;
  свг.querySelectorAll("#медленные line").forEach(л=>{

    } else if (своя){

}

// в каком доме стоит градус ПРЯМО СЕЙЧАС (дома живые, от бегущего АС)
function домТочки(градус){
  const с = window.сетка; if (!с) return null;
  const и = Math.max(0, Math.min(с.сетка.length-1, Math.round(window.минута/(с.шаг_минут||2))));
  const к = с.сетка[и].slice(1);
  const г = ((градус%360)+360)%360;
  for (let h=0; h<12; h++){
    const a=к[h], b=к[(h+1)%12]; const ширина=((b-a)%360+360)%360 || 360;
    if (((г-a)%360+360)%360 < ширина) return h+1;
  }
  return 12;
}

// ═══ ВСПЫШКИ: кольцо вокруг точки разгорается по мере схождения орбиса ═══
// Позиции натальных значков берём из самого SVG Кериткеона — тогда кольцо
// садится ровно на значок, а не «примерно в ту сторону».
window.местаТочек = {};
const РУС = {Sun:"Солнце",Moon:"Луна",Mercury:"Меркурий",Venus:"Венера",Mars:"Марс",Jupiter:"Юпитер",
  Saturn:"Сатурн",Uranus:"Уран",Neptune:"Нептун",Pluto:"Плутон",Chiron:"Хирон",Mean_Lilith:"Лилит",
  True_North_Lunar_Node:"Сев.Узел",True_South_Lunar_Node:"Юж.Узел"};

function собратьМестаТочек(){
  const свг = document.getElementById("wh").querySelector("svg"); if (!свг) return;
  window.местаТочек = {};
  свг.querySelectorAll("g").forEach(g=>{
    if (g.getAttribute("kr:node") !== "ChartPoint") return;
    const slug = g.getAttribute("kr:slug"), исп = g.querySelector("use");
    if (!slug || !исп || !РУС[slug]) return;
    const tr = (g.getAttribute("transform")||"").match(/translate\(([-\d.]+),\s*([-\d.]+)\)\s*scale\(([\d.]+)\)/);
    let x = parseFloat(исп.getAttribute("x")), y = parseFloat(исп.getAttribute("y"));
    if (tr){ const s=parseFloat(tr[3]); x = parseFloat(tr[1]) + x*s; y = parseFloat(tr[2]) + y*s; }
    window.местаТочек["натальный "+РУС[slug]] = [x, y];
  });
  // ⚠️ Транзитные значки Кериткеона лежат под цепочкой вложенных сдвигов —
  // разбирать её вручную ненадёжно (пробовал: промах до 27°). Их места
  // считаем СВОЕЙ геометрией от градуса: радиус транзитного кольца 231.
  const тр = window.сетка && window.сетка.точки;
  if (тр) for (const ключ in тр)
    if (ключ.startsWith("транзитный")) window.местаТочек[ключ] = наЭкран(тр[ключ], 231);

  // Селена и Колесо жизни — наши, ставим по своей геометрии
  const с = window.сетка;
  if (с && с.точки && с.точки["натальный Селена"] !== undefined)
    window.местаТочек["натальный Селена"] = наЭкран(с.точки["натальный Селена"], 150);
}

function вспышки(куспиды){
  const г = слой("вспышки"); if (!г) return;
  const с = window.сетка; if (!с || !с.точки) return;
  const УГЛЫ = {0:"Асцендент", 3:"IC — Глубина неба", 6:"Десцендент", 9:"MC — Середина неба"};
  const СЕПТЕНЕР = new Set(["Солнце","Луна","Меркурий","Венера","Марс","Юпитер","Сатурн"]);

  // положения быстрых тел на ТЕКУЩУЮ минуту — Луна за сутки уходит на 13°,
  // и застывшая позиция дала бы вспышку не в тот час
  const и = Math.max(0, Math.min(с.сетка.length-1, Math.round(window.минута/(с.шаг_минут||2))));
  const сейчасБыстрые = {};
  if (с.быстрые && с.быстрые_имена)
    с.быстрые_имена.forEach((имя,к)=>{ сейчасБыстрые[имя] = с.быстрые[и][к]; });

  for (const ключ in с.точки){
    const градус = (сейчасБыстрые[ключ] !== undefined) ? сейчасБыстрые[ключ] : с.точки[ключ];
    const имя = ключ.split(" ").slice(1).join(" ");
    const орбис = СЕПТЕНЕР.has(имя) ? 2 : 1;
    // ближайший из четырёх углов
    let лучший = null, мин = 999;
    for (const h in УГЛЫ){
      const d = дугаМеж(куспиды[h], градус);
      if (d < мин){ мин = d; лучший = h; }
    }
    if (мин > орбис) continue;                    // ещё далеко — не светим
    const сила = 1 - мин/орбис;                   // 0 на краю орбиса, 1 в точке
    const подпись = `<b>${УГЛЫ[лучший]} → ${ключ}</b> · ${дмс(градус)}`
                  + ` · орбис ${(мин*60).toFixed(0)}′ · ${домТочки(градус)} дом сейчас`;
    if (ключ.startsWith("транзитный")){
      // ⚠️ транзитные значки Кериткеон раздвигает, чтобы не налезали, и значок стоит
      // не ровно на своём градусе. Потому светим ДУГОЙ по кольцу — она указывает сектор
      // и от смещения значка не зависит
      г.appendChild(дугаКольца(градус, 222, 240, 2.2 + 2*сила,
                               (0.2 + 0.65*сила), подпись));
      if (сила > 0.92){
        const т = наЭкран(градус, 231);
        г.appendChild(эл("circle",{cx:т[0].toFixed(1), cy:т[1].toFixed(1), r:"3",
          fill:"#e8202a", opacity:"0.9", "data-tip":подпись}));
      }
    } else {
      const место = window.местаТочек[ключ] || наЭкран(градус, 150);
      const R = 9 + 7*сила;
      г.appendChild(эл("circle",{cx:место[0].toFixed(1), cy:место[1].toFixed(1), r:R.toFixed(1),
        fill:"none", stroke:"#e8202a", "stroke-width":(0.8+2.2*сила).toFixed(2),
        opacity:(0.25+0.7*сила).toFixed(2), "data-tip":подпись}));
      if (сила > 0.92)
        г.appendChild(эл("circle",{cx:место[0].toFixed(1), cy:место[1].toFixed(1), r:"3.5",
          fill:"#e8202a", opacity:"0.85", "data-tip":подпись}));
    }
  }
}
// светящаяся дуга по кольцу: от градуса влево-вправо на полширины
function дугаКольца(градус, Rвнутр, Rвнешн, ширинаГрад, прозр, подпись){
  const R = (Rвнутр + Rвнешн) / 2, толщина = Rвнешн - Rвнутр;
  const а1 = наЭкран(градус - ширинаГрад/2, R), а2 = наЭкран(градус + ширинаГрад/2, R);
  const большая = 0, направление = 1;
  const путь = `M ${а1[0].toFixed(1)} ${а1[1].toFixed(1)} A ${R} ${R} 0 ${большая} ${направление} ${а2[0].toFixed(1)} ${а2[1].toFixed(1)}`;
  return эл("path",{d:путь, fill:"none", stroke:"#e8202a", "stroke-width":толщина.toFixed(1),
                    opacity:прозр.toFixed(2), "stroke-linecap":"butt", "data-tip":подпись});
}

function дугаМеж(а,б){ const d=Math.abs((а-б)%360); return Math.min(d,360-d); }

function спрятатьДома(){
  const свг = document.getElementById("wh").querySelector("svg");
  if (!свг) return;
  let скрыто = 0;
  свг.querySelectorAll("g").forEach(g=>{
    const узел = g.getAttribute("kr:node");
    if (узел === "Cusp" || узел === "HouseNumber" || узел === "Houses_Wheel"){
      g.style.display = "none"; скрыто++;
    }
  });
  // буквы углов — тоже солнечные, не настоящие
  свг.querySelectorAll("text").forEach(t=>{
    const c = (t.textContent||"").trim();
    if (c==="As"||c==="Ds"||c==="Mc"||c==="Ic"){ t.style.display="none"; скрыто++; }
  });
  return скрыто;
}

const ЗНАКИ_Р = ['Овна','Тельца','Близнецов','Рака','Льва','Девы','Весов','Скорпиона','Стрельца','Козерога','Водолея','Рыб'];
function дмс(г){
  // ⚠️ раньше при s===60 секунды обнулялись, но минута не прибавлялась:
  // 59.99999° показывалось как 29°59'00" Тельца вместо 30°00'00"
  let x = ((г%360)+360)%360;
  let d = Math.floor(x%30), м = Math.floor(((x%30)-d)*60), с = Math.round(((((x%30)-d)*60)-м)*60);
  if (с===60){ с=0; м++; }
  if (м===60){ м=0; d++; }
  if (d===30){ d=0; x = (x+0.0001)%360; }        // перешли в следующий знак
  return `${d}°${String(м).padStart(2,'0')}'${String(с).padStart(2,'0')}" ${ЗНАКИ_Р[Math.floor(x/30)]}`;
}

// ═══ СВЯЗКА: наши окна → скрытые поля карты → её же расчёт ═══
// Карта не тронута: она по-прежнему строит колесо, ведёт живой асцендент и веер.
// Мы лишь подставляем ей данные и кладём поверх свои слои.
async function рассчитатьДень(){
  const ч = ($("дата_р").value||"").split(".").map(Number);
  if (!годна(ч)){ $("статус").textContent = "впиши дату рождения"; return; }
  const шр = parseFloat($("шир_р").value), др = parseFloat($("долг_р").value);
  if (isNaN(шр)||isNaN(др)){ $("статус").textContent = "нет координат рождения"; return; }
  const gmtР = parseFloat(($("gmt_р").value||"0").replace(",", ".")) || 0;

  // 1. якорь — градус асцендента на секунду вопроса
  $("статус").textContent = "беру якорь…";
  try{
    const ш = parseFloat($("шир_с").value), д = parseFloat($("долг_с").value);
    const t = await (await fetch(`/transit?latitude=${ш}&longitude=${д}`)).json();
    if (t && t.angles){ window.якорьГрадус = t.angles.ASC;
      $("якорь_гр").textContent = дмс(t.angles.ASC);
      $("якорь_врем").textContent = "· взят " + new Date().toLocaleString("ru-RU"); }
  }catch(e){}

  // 2. солнечный час — момент, когда асцендент равен Солнцу
  $("статус").textContent = "ищу солнечный час…";
  let сч = null;
  try{
    const r = await fetch(`/solar-hour?year=${ч[2]}&month=${ч[1]}&day=${ч[0]}&lat=${шр}&lon=${др}&gmt=${gmtР}`);
    if (!r.ok){ $("статус").innerHTML = `<span style="color:#e8202a">солнечный час: ${await разобратьОшибку(r)}</span>`; return; }
    сч = await r.json();
    window.поворотКолеса = сч.солнце;
    $("подпись_карты").textContent = сч.солнце_на_асценденте
      ? `Солнце на асценденте · солнечный час ${сч.час}` : `солнечного часа нет — местный полдень`;
    $("оговорка").textContent = сч.оговорка;
  }catch(e){ $("статус").textContent = "солнечный час: " + e.message; return; }

  // 3. КОЛЕСО СТРОИТ САМА КАРТА — её же расчётом, по нашим данным.
  //    Тогда веер, буквы углов, градусы и живой асцендент у неё правильные.
  подставитьМестоВКарту();
  подставитьЧеловекаВКарту(сч.час);
  $("статус").textContent = "строю колесо…";
  try{
    if (typeof showNatal === "function") await showNatal(true);
  }catch(e){ $("статус").textContent = "колесо: " + e.message; return; }

  // 4. наши слои поверх её колеса + круг суток
  спрятатьДома();
  пятноВЦентре();
  await взятьСетку();
}

// наши поля → скрытые поля карты, по которым она считает

    if (и && м && м.value) и.value = м.value;

}

function подставитьЧеловекаВКарту(солнечныйЧас){
  const пары = [["dt", $("дата_р").value], ["tm", солнечныйЧас || "12:00:00"],
                ["la", $("шир_р").value], ["lo", $("долг_р").value],
                ["tz", ($("gmt_р").value||"").replace("+","")], ["nm", $("имя").value]];

}



// ═══════════ СВЯЗКА С КАРТОЙ ═══════════
// Карта строит колесо сама и обновляет его своим циклом. Мы НИЧЕГО не подменяем:
// подставляем ей наши данные, а после каждой её перерисовки кладём свои слои.

// 1. Наши поля → её скрытые поля
function подставитьМестоВКарту(){
  [["шир_с","tlat"],["долг_с","tlon"],["gmt_с","tgmt"]].forEach(([наше,её])=>{
    const и = document.getElementById(её), м = document.getElementById(наше);
    if (и && м && м.value) и.value = м.value;
  });
  const г = document.getElementById("город_с"), гк = document.getElementById("tcity");
  if (г && гк && г.selectedOptions && г.selectedOptions.length) гк.value = г.selectedOptions[0].textContent;
}
function подставитьЧеловекаВКарту(солнечныйЧас){
  [["dt", $("дата_р").value], ["tm", солнечныйЧас || "12:00:00"],
   ["la", $("шир_р").value], ["lo", $("долг_р").value],
   ["tz", ($("gmt_р").value||"").replace("+","")], ["nm", $("имя").value]]
  .forEach(([id,з])=>{ const э = document.getElementById(id); if (э && з) э.value = з; });
}

// ⚠️ ДОМА В ПОДСКАЗКАХ. Карта берёт дом из выкладки Кериткеона — а он тут
// СОЛНЕЧНЫЙ (космограмма построена на солнечный час). Ты видишь Нептун в 9-м
// живом доме, а подпись говорила «8 дом» — это дом солнечной карты.
// В прогнозе солнечных домов нет вовсе, потому переписываем на ЖИВОЙ.
// метка ставится СРАЗУ ПОСЛЕ ИМЕНИ: «Нептун косм. · 11°16′ Скорпиона · 9 дом сейчас»
function сМеткой(текст, метка){
  const краска = `<span style="color:#8a93b5">${метка}</span>`;
  if (текст.includes("</b>")) return текст.replace("</b>", ` ${краска}</b>`);
  const м = текст.match(/^([^·]+?)(\s*·)/);          // имя до первой точки-разделителя
  if (м) return текст.replace(м[0], `${м[1].trim()} ${краска}${м[2]}`);
  return `${текст} ${краска}`;
}

function домаВПодсказкахЖивые(){
  const свг = document.getElementById("wh") && document.getElementById("wh").querySelector("svg");
  if (!свг || !window.сетка) return 0;
  let правок = 0;
  // транзитное кольцо: берём градусы из сетки и метим подписи
  const тр = window.сетка && window.сетка.точки;
  if (тр) свг.querySelectorAll(".transit-planet-name").forEach(g=>{
    const т = g.getAttribute("data-tip"); if (!т) return;
    if (/косм\.|транз\./.test(т)) return;
    g.setAttribute("data-tip", сМеткой(т, "транз.")); правок++;
  });

  свг.querySelectorAll("[kr\\:absoluteposition]").forEach(g=>{
    const гр = parseFloat(g.getAttribute("kr:absoluteposition"));
    if (isNaN(гр)) return;
    const живой = домТочки(гр);
    // сама точка и всё, что внутри неё
    [g, ...g.querySelectorAll("[data-tip]")].forEach(э=>{
      const т = э.getAttribute && э.getAttribute("data-tip");
      if (!т) return;
      // живые куспиды карты трогать нельзя — у них номер и так живой,
      // а моя приписка делала из «Куспид 2 дома» бессмысленное «· сейчас»
      if (/Куспид|дом карты|Асцендент|Десцендент|MC|IC/i.test(т)) return;
      let новый = т.replace(/·\s*\d+\s*дом(\s*сейчас)?/g, `· ${живой} дом сейчас`);
      // помечаем, чья точка: космограмма или транзитное кольцо — чтобы не гадать
      const транзитная = !!(э.closest && э.closest(".transit-planet-name"))
                      || !!(g.closest && g.closest(".transit-planet-name"));
      const метка = транзитная ? "транз." : "косм.";
      if (!/косм\.|транз\./.test(новый)) новый = сМеткой(новый, метка);
      const итог = /дом/.test(новый) ? новый : `${новый} · ${живой} дом сейчас`;
      if (итог !== т){ э.setAttribute("data-tip", итог); правок++; }
    });
  });
  return правок;
}

// 2. Наши слои поверх её колеса — вызываются ПОСЛЕ каждой её перерисовки
function нашиСлои(){
  if (!window.сетка) return;
  const свг = document.getElementById("wh") && document.getElementById("wh").querySelector("svg");
  if (!свг) return;
  спрятатьДома();          // солнечные дома космограммы не показываем
  пятноВЦентре();          // чистая середина
  медленныеВЦентре(window.сетка);   // дирекции, прогрессии и их струны
  дорисоватьТочки(window.сетка);    // Колесо жизни (Селену карта рисует сама)
  собратьМестаТочек();
  вспышки(текущиеКуспиды());
  домаВПодсказкахЖивые();      // подписи должны говорить про живые дома, не солнечные
  setTimeout(домаВПодсказкахЖивые, 1200);   // страховка: карта дооснащает подсказки позже
}
function текущиеКуспиды(){
  const с = window.сетка; if (!с) return [];
  const и = Math.max(0, Math.min(с.сетка.length-1, Math.round((window.минута||0)/(с.шаг_минут||2))));
  return с.сетка[и].slice(1);
}

// 3а. Оборачиваем ЕЁ оснаститьКарту: она навесила подсказки — мы сразу правим дома
//     на живые (иначе её позднее оснащение затирает нашу правку — так и было)
(function цепляемсяКПодсказкам(){
  if (typeof оснаститьКарту !== "function"){ setTimeout(цепляемсяКПодсказкам, 300); return; }
  const её = оснаститьКарту;
  window.оснаститьКарту = function(){
    const итог = её.apply(this, arguments);
    try{ домаВПодсказкахЖивые(); }catch(e){}
    return итог;
  };
})();

// 3. Оборачиваем ЕЁ setWheel: она нарисовала — мы следом. Ничего не спорит,
//    и при её минутном обновлении слои возвращаются сами.
(function цепляемся(){
  if (typeof setWheel !== "function"){ setTimeout(цепляемся, 300); return; }
  const её = setWheel;
  window.setWheel = function(svgT, live){
    const итог = её.apply(this, arguments);
    setTimeout(нашиСлои, 0);
    return итог;
  };
})();

// 4. Кнопка: якорь → солнечный час → её расчёт колеса → круг суток
async function рассчитатьДень(){
  const ч = ($("дата_р").value||"").split(".").map(Number);
  if (!годна(ч)){ $("статус").textContent = "впиши дату рождения"; return; }
  const шр = parseFloat($("шир_р").value), др = parseFloat($("долг_р").value);
  if (isNaN(шр)||isNaN(др)){ $("статус").textContent = "нет координат рождения"; return; }
  const gmtР = parseFloat(($("gmt_р").value||"0").replace(",",".")) || 0;

  $("статус").textContent = "беру якорь…";
  try{
    const ш = parseFloat($("шир_с").value), д = parseFloat($("долг_с").value);
    const t = await (await fetch(`/transit?latitude=${ш}&longitude=${д}`)).json();
    if (t && t.angles){ window.якорьГрадус = t.angles.ASC;
      $("якорь_гр").textContent = дмс(t.angles.ASC);
      $("якорь_врем").textContent = "· взят " + new Date().toLocaleString("ru-RU"); }
  }catch(e){}

  $("статус").textContent = "ищу солнечный час…";
  let сч = null;
  try{
    const r = await fetch(`/solar-hour?year=${ч[2]}&month=${ч[1]}&day=${ч[0]}&lat=${шр}&lon=${др}&gmt=${gmtР}`);
    if (!r.ok){ $("статус").innerHTML = `<span style="color:#e8202a">солнечный час: ${await разобратьОшибку(r)}</span>`; return; }
    сч = await r.json();
    $("подпись_карты").textContent = сч.солнце_на_асценденте
      ? `космограмма · Солнце на асценденте · солнечный час ${сч.час}`
      : `космограмма · солнечного часа нет — местный полдень`;
    if (сч.оговорка) $("оговорка").textContent = сч.оговорка;
  }catch(e){ $("статус").textContent = "солнечный час: " + e.message; return; }

  // КОЛЕСО СТРОИТ САМА КАРТА по нашим данным: космограмма + транзитное кольцо
  подставитьМестоВКарту();
  подставитьЧеловекаВКарту(сч.час);
  $("статус").textContent = "строю колесо…";
  try{ if (typeof showNatal === "function") await showNatal(true); }
  catch(e){ $("статус").textContent = "колесо: " + e.message; return; }

  await взятьСетку();     // круг суток: главы, узлы, медленные, полочка
  нашиСлои();
  таблицыВнизу(ч, шр, др, gmtР);   // 06.09, его слово: внизу — все таблицы, как на других картах
}


// ── 06.09, его слово: медленные планеты отдельной таблицей — где стоят на момент дня и их связи ──
function таблицаМедленных(перед){
  const с = window.сетка, м = с && с.медленные; if (!м) return;
  let б = document.getElementById("medl"); if (б) б.remove();
  б = document.createElement("div"); б.id = "medl"; б.className = "data"; б.style.maxWidth = "1500px";
  const дир = м.дирекции || [], прог = м.прогрессии || [], асп = м.аспекты || [];
  const прогПо = {}; прог.forEach(p => { прогПо[p.имя] = p; });
  let h = `<div class="st" style="display:block !important">Медленные планеты на ${$("день").value || "этот день"} · дуга ${(+м.дуга).toFixed(2)}° · прожито ${(+м.лет).toFixed(1)} лет</div>`;
  h += '<table><tr><th>Точка</th><th>Дирекция</th><th>Прогрессия</th></tr>';
  const имена = [...new Set([...дир.map(d => d.имя), ...прог.map(p => p.имя)])];
  const дирПо = {}; дир.forEach(d => { дирПо[d.имя] = d; });
  имена.forEach(и => { const d = дирПо[и], p = прогПо[и];
    h += `<tr><td>${и}</td><td style="color:#a0a8c0">${d ? d.текст : "—"}</td><td style="color:#a0a8c0">${p ? p.текст : "—"}</td></tr>`; });
  h += '</table>';
  h += `<div class="st" style="display:block !important">Связи медленных с космограммой · орбис 1° · ${асп.length}</div>`;
  h += '<table><tr><th>Слой</th><th>Точка</th><th>Аспект</th><th>К</th><th>Орбис</th></tr>';
  асп.slice().sort((a, b) => a.орбис - b.орбис).forEach(a => {
    const цв = /квадрат|оппозиц/.test(a.аспект) ? "#e05555" : (/трин|секстил/.test(a.аспект) ? "#4fbf7a" : "#e0e0e0");
    h += `<tr><td style="color:#5060a0">${a.слой}</td><td>${a.точка} <span style="color:#7080a0">${дмс(a.градус)}</span></td><td style="color:${цв}">${a.аспект}</td><td>${(a.к||"").replace("космограмма ","")} <span style="color:#7080a0">${дмс(a.градус_цели)}</span></td><td style="color:#a0a8c0">${(+a.орбис).toFixed(2)}°</td></tr>`; });
  h += '</table>';
  б.innerHTML = h;
  перед.parentNode.insertBefore(б, перед);
}
// ── 06.09: таблицы внизу страницы — наши (углы, планеты, аспекты, окна градусов)
//    и таблицы Кериkeion к паре «космограмма + момент дня». Ставятся после полочки.
async function таблицыВнизу(ч, шр, др, gmtР){
  const nd = $("nd"), kt = $("kt"), полка = $("карта_полочка");
  if (!nd || !kt) return;
  if (полка && полка.parentNode){ полка.parentNode.insertBefore(nd, полка.nextSibling); nd.parentNode.insertBefore(kt, nd.nextSibling); }
  document.body.classList.add("таблицы");
  таблицаМедленных(nd);
  // наши таблицы уже собраны картой (#nd) — космограмма без времени: углов нет, домов нет
  if (typeof buildTbl === "function" && window.natal && !window.natal.detail){
    const h0 = nd.innerHTML; buildTbl(window.natal);
    nd.innerHTML = nd.innerHTML.replace(/<div class="st">Углы<\/div><table>.*?<\/table>/s, "")
                               .replace(/<div class="st">Планеты<\/div>/, '<div class="st">Планеты · космограмма, время рождения не указано</div>')
                               .replace(/<td style="color:#5a6080">\d+ \(\d\/3\)<\/td>/g, '<td style="color:#5a6080">—</td>');
  }
  kt.innerHTML = '<div class="st">Таблицы Кериkeion · космограмма + момент дня</div>';
  try{
    const ш = parseFloat($("шир_с").value), д = parseFloat($("долг_с").value);
    const тело = { zakaz:"tranzity", year:ч[2], month:ч[1], day:ч[0], vremya_izvestno:false, gmt:gmtР,
                   latitude:шр, longitude:др, tr_lat:ш, tr_lon:д, view:"tables",
                   moment_utc: (window.сетка && window.сетка.начало_utc) ? window.сетка.начало_utc : null };
    const о = await fetch("/chart-wheel-zakaz", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(тело) });
    if (о.ok){ const j = await о.json(); kt.innerHTML += j.tables || ""; }
    else kt.innerHTML += '<div class="err">таблицы Кериkeion: ' + (await о.text()).slice(0,200) + '</div>';
  }catch(e){ kt.innerHTML += '<div class="err">таблицы Кериkeion: ' + e.message + '</div>'; }
}
