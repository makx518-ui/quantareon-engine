<!-- ИСТОРИЯ КАРТ · одна карточка на расчёт, внутри две ссылки
     Его правило 05.09: слева карта клиента, справа механика для ИИ.
     Открывается отдельной страницей, сверху стрелка возврата. -->

<a href="/" class="ist-nazad" title="К картам">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
  </svg>
  <span>к картам</span>
</a>

<div class="ist-list">
  <header class="ist-shapka">
    <h1>📜 История разборов 📜</h1>
    <div class="ist-schet"><span id="ist-vsego">0</span> расчётов</div>
    <button class="ist-ochistit" onclick="история_очистить()">🗑 Очистить всю историю</button>
  </header>

  <div class="ist-kolonki-zag">
    <span>☉ карта клиенту</span>
    <span>⚙ механика расклада</span>
  </div>

  <div id="ist-karty"></div>
</div>

<script>
async function история_загрузить() {
  try {
    const о = await fetch("/api/istoriya").then(r => r.json());
    история_нарисовать(о.raschety || []);
  } catch (e) {
    document.getElementById("ist-karty").innerHTML =
      `<div class="ist-pusto">не удалось загрузить: ${e.message}</div>`;
  }
}

function история_нарисовать(расчёты) {
  document.getElementById("ist-vsego").textContent = расчёты.length;
  const место = document.getElementById("ist-karty");
  if (!расчёты.length) {
    место.innerHTML = `<div class="ist-pusto">пока пусто — рассчитайте первую карту</div>`;
    return;
  }
  место.innerHTML = расчёты.map((р, i) => `
    <article class="ist-karta">
      <div class="ist-verh">
        <span class="ist-nomer">${расчёты.length - i}</span>
        <span class="ist-imya">${р.imya}</span>
        <span class="ist-tip">${р.znachok} ${р.zakaz}${р.rozhdenie ? " · " + р.rozhdenie : ""}</span>
        <span class="ist-data">✧ ${р.data}</span>
        <button class="ist-knopka ist-udalit" title="удалить расчёт"
                onclick="история_udalit('${р.id}')">🗑</button>
      </div>

      <div class="ist-dve">
        ${половина("karta", р, "☉", "карта клиенту", "трактовка без терминов")}
        ${половина("kuhnya", р, "⚙", "механика расклада", "все слои, для ученика")}
      </div>
    </article>`).join("");
}

function половина(вид, р, значок, подпись, пояснение) {
  const файл = вид === "karta" ? р.fayl_karty : р.fayl_kuhni;
  if (!файл) {
    return `<div class="ist-pol ist-net"><span class="ist-pol-zag">${значок} ${подпись}</span>
              <span class="ist-pol-net">не создана</span></div>`;
  }
  return `<div class="ist-pol" onclick="открыть('${вид}','${файл}')">
      <span class="ist-pol-zag">${значок} ${подпись}</span>
      <span class="ist-pol-pod">${пояснение}</span>
      <span class="ist-pol-knopki">
        <button class="ist-mini" title="скопировать"
                onclick="event.stopPropagation(); скопировать('${вид}','${файл}')">⧉</button>
        <button class="ist-mini" title="скачать"
                onclick="event.stopPropagation(); скачать('${вид}','${файл}','${р.imya}')">↓</button>
        <span class="ist-otkryt">открыть ›</span>
      </span>
    </div>`;
}

function открыть(вид, файл) {
  window.open(`/istoriya/${вид}?f=` + encodeURIComponent(файл), "_blank");
}

async function скопировать(вид, файл) {
  const о = await fetch(`/api/${вид}?f=` + encodeURIComponent(файл));
  const т = await о.text();
  await navigator.clipboard.writeText(т);
  всплывашка("скопировано");
}

async function скачать(вид, файл, имя) {
  const о = await fetch(`/api/${вид}?f=` + encodeURIComponent(файл));
  const б = await о.blob();
  const с = document.createElement("a");
  с.href = URL.createObjectURL(б);
  с.download = `${имя} · ${вид === "karta" ? "карта" : "механика"}.${вид === "karta" ? "html" : "json"}`;
  с.click();
  URL.revokeObjectURL(с.href);
}

function всплывашка(т) {
  const у = document.createElement("div");
  у.className = "ist-vsplyv"; у.textContent = т;
  document.body.appendChild(у);
  setTimeout(() => у.remove(), 1600);
}

async function история_udalit(id) {
  if (!confirm("Удалить этот расчёт целиком — карту и механику?")) return;
  await fetch("/api/istoriya/udalit", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ id })
  });
  история_загрузить();
}

async function история_очистить() {
  if (!confirm("Очистить всю историю? Это нельзя отменить.")) return;
  await fetch("/api/istoriya/ochistit", { method: "POST" });
  история_загрузить();
}

document.addEventListener("DOMContentLoaded", история_загрузить);
</script>
