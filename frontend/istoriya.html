<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>История разборов · Квантареон</title>
<style>
/* ── стиль сайта: те же цвета и шрифт, что на главной ── */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0f1a;color:#d0d0d8;font-family:'Segoe UI',sans-serif;font-size:13px}

.hdr{background:#141628;border-bottom:1px solid #2a2d42;padding:6px 12px;
     position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hdr .ttl{color:#f0c040;font-size:14px;letter-spacing:3px;flex:1;text-align:center}
.b{background:#2a3a5c;border:1px solid #3a4a6c;color:#c0c8e0;padding:3px 8px;
   border-radius:3px;font-size:10px;cursor:pointer;text-decoration:none;
   display:inline-flex;align-items:center;gap:4px}
.b:hover{background:#3a5a8c}
.b.bg{background:#5a4a1a;border-color:#8a7a3a;color:#f0c040}
.b.bg:hover{background:#7a6420}
.b.dan{background:#3a1a1a;border-color:#6c3a3a;color:#e09070}
.b.dan:hover{background:#5a2020}

.wrap{max-width:900px;margin:0 auto;padding:14px 10px 60px}
.schet{text-align:center;color:#7078a0;font-size:10px;text-transform:uppercase;
       letter-spacing:1px;margin:10px 0 12px}
.schet b{color:#f0c040;font-size:13px}

.kolonki{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 5px;
         color:#7078a0;font-size:9px;text-transform:uppercase;letter-spacing:1px}

.karta{background:#12142a;border:1px solid #2a2d42;border-radius:4px;
       margin-bottom:8px;padding:9px 12px}
.karta:hover{border-color:#3a4a6c}
.verh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.nom{width:20px;height:20px;flex:0 0 auto;display:inline-flex;align-items:center;
     justify-content:center;border-radius:50%;background:#1a2040;color:#8890b0;font-size:10px}
.imya{color:#d0d0d8;font-size:13px}
.tip{color:#8890b0;font-size:10px}
.data{color:#7078a0;font-size:9px;margin-left:auto}

.dve{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pol{background:#0a0c16;border:1px solid #1a1d30;border-radius:3px;padding:8px 10px;
     cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pol:hover{border-color:#8a7a3a;background:#0f1220}
.pol.net{opacity:.4;cursor:default}
.pol.net:hover{border-color:#1a1d30;background:#0a0c16}
.pz{color:#c0c8e0;font-size:11px}
.pp{color:#7078a0;font-size:9px}
.pk{display:flex;align-items:center;gap:5px;margin-top:4px}
.mini{background:transparent;border:1px solid #2a3a5c;color:#7078a0;width:20px;height:20px;
      border-radius:3px;font-size:10px;cursor:pointer;padding:0}
.mini:hover{border-color:#8a7a3a;color:#f0c040}
.otk{margin-left:auto;color:#7078a0;font-size:9px}
.pol:hover .otk{color:#f0c040}

.pusto{text-align:center;color:#7078a0;padding:40px 0;font-size:12px}
.vspl{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;
      background:#5a4a1a;border:1px solid #8a7a3a;color:#f0c040;
      padding:6px 16px;border-radius:3px;font-size:11px}

@media(max-width:640px){
  .dve,.kolonki{grid-template-columns:1fr}
  .kolonki{display:none}
  .hdr .ttl{font-size:11px;letter-spacing:1px}
}
</style>
</head>
<body>

<div class="hdr">
  <a href="/" class="b" title="К картам">← к картам</a>
  <span class="ttl">ИСТОРИЯ РАЗБОРОВ</span>
  <button class="b dan" onclick="очистить()">🗑 очистить</button>
</div>

<div class="wrap">
  <div class="schet"><b id="vsego">0</b> расчётов в архиве</div>
  <div class="kolonki"><span>☉ карта клиенту</span><span>⚙ механика расклада</span></div>
  <div id="spisok"></div>
</div>

<script>
let РАСЧЁТЫ = [];

function э(т){return String(т==null?"":т).replace(/[&<>"]/g,с=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[с]));}

async function загрузить(){
  try{
    const о = await fetch("/api/istoriya").then(r=>r.json());
    нарисовать(о.raschety||[]);
  }catch(e){
    document.getElementById("spisok").innerHTML =
      `<div class="pusto">не удалось загрузить: ${э(e.message)}</div>`;
  }
}

function нарисовать(р){
  РАСЧЁТЫ = р;
  document.getElementById("vsego").textContent = р.length;
  const м = document.getElementById("spisok");
  if(!р.length){ м.innerHTML = `<div class="pusto">пока пусто — рассчитайте первую карту</div>`; return; }
  м.innerHTML = р.map((з,i)=>`
    <div class="karta">
      <div class="verh">
        <span class="nom">${р.length-i}</span>
        <span class="imya">${э(з.imya)}</span>
        <span class="tip">${з.znachok} ${э(з.zakaz)}${з.rozhdenie?" · "+э(з.rozhdenie):""}</span>
        <span class="data">${э(з.data)}</span>
        <button class="mini" data-i="${i}" data-act="del" title="удалить расчёт">🗑</button>
      </div>
      <div class="dve">
        ${пол("karta",з,i,"☉","карта клиенту","трактовка без терминов")}
        ${пол("kuhnya",з,i,"⚙","механика расклада","все слои, для ученика")}
      </div>
    </div>`).join("");
  // ⚠️ пути НЕ в атрибутах: там кириллица и слэши, атрибут ломался
  м.querySelectorAll("[data-act]").forEach(у=>{
    у.addEventListener("click", с=>{
      с.stopPropagation();
      const з = РАСЧЁТЫ[+у.dataset.i]; if(!з) return;
      const вид = у.dataset.vid;
      const файл = вид==="karta" ? з.fayl_karty : з.fayl_kuhni;
      const что = у.dataset.act;
      if(что==="del") удалить(з.id);
      else if(что==="open") window.open(`/istoriya/${вид}?f=`+encodeURIComponent(файл),"_blank");
      else if(что==="copy") копировать(вид,файл);
      else if(что==="save") скачать(вид,файл,з.imya);
    });
  });
}

function пол(вид,з,i,значок,подпись,поясн){
  const файл = вид==="karta" ? з.fayl_karty : з.fayl_kuhni;
  if(!файл) return `<div class="pol net"><span class="pz">${значок} ${подпись}</span><span class="pp">не создана</span></div>`;
  return `<div class="pol" data-i="${i}" data-vid="${вид}" data-act="open">
      <span class="pz">${значок} ${подпись}</span>
      <span class="pp">${поясн}</span>
      <span class="pk">
        <button class="mini" data-i="${i}" data-vid="${вид}" data-act="copy" title="скопировать">⧉</button>
        <button class="mini" data-i="${i}" data-vid="${вид}" data-act="save" title="скачать">↓</button>
        <span class="otk">открыть ›</span>
      </span>
    </div>`;
}

async function копировать(вид,файл){
  const т = await fetch(`/api/${вид}?f=`+encodeURIComponent(файл)).then(r=>r.text());
  await navigator.clipboard.writeText(т);
  всплыть("скопировано");
}

async function скачать(вид,файл,имя){
  const б = await fetch(`/api/${вид}?f=`+encodeURIComponent(файл)).then(r=>r.blob());
  const с = document.createElement("a");
  с.href = URL.createObjectURL(б);
  с.download = `${имя} · ${вид==="karta"?"карта":"механика"}.${вид==="karta"?"html":"json"}`;
  с.click(); URL.revokeObjectURL(с.href);
}

function всплыть(т){
  const у=document.createElement("div"); у.className="vspl"; у.textContent=т;
  document.body.appendChild(у); setTimeout(()=>у.remove(),1500);
}

async function удалить(ид){
  if(!confirm("Удалить расчёт целиком — карту и механику?")) return;
  await fetch("/api/istoriya/udalit",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({id:ид})});
  загрузить();
}

async function очистить(){
  if(!confirm("Очистить всю историю? Это нельзя отменить.")) return;
  await fetch("/api/istoriya/ochistit",{method:"POST"});
  загрузить();
}

document.addEventListener("DOMContentLoaded", загрузить);
</script>
</body>
</html>
