<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квантареон — Астро-фрактал</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='55' font-size='98' text-anchor='middle' dominant-baseline='central' fill='%237fb0ff'>%E2%99%85</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0f1a;color:#d0d0d8;font-family:'Segoe UI',sans-serif;font-size:13px}
.hdr{background:#141628;border-bottom:1px solid #2a2d42;padding:6px 12px;position:sticky;top:0;z-index:100}
.ttl{text-align:center;font-size:18px;font-weight:600;color:#f0c040;letter-spacing:2px;padding:4px 0;text-shadow:0 0 20px rgba(240,192,64,0.3)}

input.w{width:110px}
.b{background:#2a3a5c;border:1px solid #3a4a6c;color:#c0c8e0;padding:3px 8px;border-radius:3px;font-size:10px;cursor:pointer}
.b:hover{background:#3a5a8c}
.bg{background:#5a4a1a;border-color:#8a7a3a;color:#f0c040;font-weight:600}
.sep{width:1px;height:16px;background:#2a2d42;display:inline-block}
.prow{display:none;background:#12142a;border-top:1px solid #2a2d42;padding:3px 12px}
.prow.show{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.chart{text-align:center;padding:4px;border-bottom:1px solid #2a2d42;background:#0a0c16}
#fsBtn{position:absolute;top:6px;right:10px;z-index:60;width:32px;height:32px;border-radius:50%;background:#1a2040;border:1px solid #3a4a6c;color:#c0c8e0;font-size:15px;line-height:1;cursor:pointer;opacity:0.7}
#fsBtn:hover{opacity:1}
#wh:fullscreen{display:flex;align-items:center;justify-content:center;background:#0a0c16;width:100vw;height:100vh}
#wh:-webkit-full-screen{display:flex;align-items:center;justify-content:center;background:#0a0c16;width:100vw;height:100vh}
#wh:fullscreen svg{height:96vh!important;width:auto!important;max-width:100vw!important}
#wh:-webkit-full-screen svg{height:96vh!important;width:auto!important;max-width:100vw!important}
.chart svg{height:90vh;width:auto;max-width:100%;display:block;margin:0 auto;overflow:visible}
.tblk{padding:4px;overflow-x:auto;border-bottom:1px solid #2a2d42;text-align:center}
.tblk svg{max-width:100%;height:auto;display:block;margin:0 auto}
.krow{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.kcell svg{max-width:100%;height:auto;display:block}
.data{padding:8px 16px;max-width:1000px;margin:0 auto}
.st{padding:4px 0;font-size:11px;font-weight:600;color:#8890b0;text-transform:uppercase;border-bottom:1px solid #2a2d42;margin-top:12px}
table{width:100%;border-collapse:collapse}
td,th{padding:2px 6px;text-align:left;border-bottom:1px solid #1a1d2a;font-size:11px}
th{color:#606888;font-size:9px;text-transform:uppercase}
tr:hover{background:#1a2040}
.cbox{background:#0f1120;border:1px solid #2a2d42;border-radius:6px;padding:10px;margin:6px 0;white-space:pre-wrap;font-family:Consolas,monospace;font-size:11px;color:#a0a8c0;max-height:500px;overflow-y:auto}
.err{color:#e05040;padding:16px}
.fw{position:fixed;background:#141628;border:1px solid #3a4a6c;border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:200;min-width:320px;max-width:600px;max-height:80vh;overflow-y:auto}
.fwh{background:#1a2040;padding:4px 8px;cursor:move;display:flex;justify-content:space-between;align-items:center;border-radius:6px 6px 0 0}
.fwh span{color:#8890b0;font-size:11px;font-weight:600}
.fwx{color:#e05040;cursor:pointer;font-size:16px;font-weight:600;padding:0 4px}
.fwb{padding:8px}
.ton{color:#50e050;font-family:monospace;font-size:13px;font-weight:600}
.toff{color:#4a5070;font-family:monospace;font-size:13px}
body.lt{background:#eef0f5;color:#22242e}
body.lt .hdr{background:#dfe3ee;border-bottom-color:#c2c8d8}
body.lt .ttl{color:#9a6b00;text-shadow:none}
body.lt label{color:#5a6080}
body.lt input{background:#fff;border-color:#c2c8d8;color:#22242e}
body.lt .b{background:#d2dcf0;border-color:#b2c0e0;color:#2a3a6c}
body.lt .b:hover{background:#bcccf0}
body.lt .chart{background:#fff;border-bottom-color:#c2c8d8}
body.lt .tblk{border-bottom-color:#c2c8d8}
body.lt .st{color:#5a6080;border-bottom-color:#c2c8d8}
body.lt td,body.lt th{border-bottom-color:#dde1ec}
body.lt th{color:#7078a0}
body.lt tr:hover{background:#e4e8f4}
body.lt .cbox{background:#f4f6fb;border-color:#c2c8d8;color:#33384a}
.lt .irow{border-top-color:#d2d6e2}
.lt .rlbl{color:#3a4a6c}
.lt .bm{background:#d8ecd8;border-color:#a8d0a8;color:#2a7a3a}
.lt .bm:hover{background:#c8e4c8}
.lt .sep{background:#c2c8d8}
.lt input::placeholder{color:#9098b0}
.irow{display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap;margin:4px 0;padding:4px 0;border-top:1px solid #1e2138}
.rlbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-right:6px;min-width:120px}
.bm{background:#1a3a2a;border-color:#3a6a4a;color:#60d090}
.bm:hover{background:#2a5a3a}
#qtip{position:fixed;display:none;pointer-events:none;z-index:9999;
background:#0b0e1a;border:1px solid rgba(212,175,90,.45);border-radius:8px;
padding:5px 10px;color:#e8e2d4;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.55)}
#qtip b{color:#e8c060;font-weight:600}
#qtip i{color:#ff5a5a;font-style:normal}
[data-tip]{cursor:help}
</style>
</head>
<body>
<div class="hdr">
<div class="ttl">КВАНТАРЕОН — АСТРО-ФРАКТАЛ</div>
<div class="row">
  <div style="cursor:pointer;padding:2px 6px;background:#1a1d30;border:1px solid #2a2d42;border-radius:3px;display:flex;align-items:center;gap:4px" onclick="toggleTimer()">
    <span style="font-size:9px" id="tlbl" class="ton">⏱ LIVE</span>
    <span class="ton" id="tclk">00:00:00</span>
    <span style="font-size:9px;color:#5060a0" id="tdt"></span>
  </div>
  <div class="sep"></div>
  <span class="rlbl" style="color:#e8a030;min-width:auto">📍 Я сейчас</span>
  <input id="tcity" value="Ижевск" style="width:96px" title="Место для расчёта транзита"><button class="b" onclick="geoNow()" title="Найти координаты и время города">🔍</button>
  
  <label>GMT</label><input id="tgmt" value="+4" style="width:32px">
  <label>Шир</label><input id="tlat" value="56.85" style="width:64px" title="Широта">
  <label>Долг</label><input id="tlon" value="53.233333" style="width:64px" title="Долгота">
  <button class="b" onclick="clearNow()" title="Очистить — вписать другое место">✕</button>
  <div class="sep"></div>
  <button class="b" id="bthm" onclick="toggleTheme()">🌙 Тема</button><a class="b" href="/istoriya" id="bist" style="text-decoration:none;padding:3px 12px" title="Все сделанные карты">📜 История <span id="istN" style="color:#f0c040"></span></a>
</div>

<div class="irow">
  <span class="rlbl" style="color:#4da6d9">☉ Я / НАТАЛ</span>
  <label>Имя</label><input class="w" id="nm" placeholder="Имя">
  <label>Дата</label><input id="dt" placeholder="ДД.ММ.ГГГГ">
  <label>Время</label><input id="tm" placeholder="ЧЧ:ММ:СС">
  <label>Страна</label><input id="cn" placeholder="Страна" style="width:80px"><label>Область</label><input id="cr" placeholder="Область" style="width:80px"><label>Район</label><input id="cd" placeholder="Район" style="width:80px">
  <label>Город</label><input class="w" id="pl" placeholder="Город / село">
  <button class="b" onclick="geoFind('me')" title="Найти координаты">🔍</button>
  <label>GMT</label><input id="tz" placeholder="+ч" style="width:32px" title="Заполнится сам после 🔍 — исторический пояс на дату рождения">
  <label>Шир</label><input id="la" placeholder="широта" style="width:72px">
  <label>Долг</label><input id="lo" placeholder="долгота" style="width:72px">
  <button class="b" onclick="clearMe()" title="Очистить (ввести другого)">✕</button>
  <button class="b bm" onclick="loadMatrix()" title="Вернуть мои данные (из engine/matrix.py) и построить мой натал">📌 Мои данные</button>
  <button class="b bg" onclick="showNatal(false,true)">🔮 Рассчитать</button><button class="b" onclick="raskladka('tranzity')" title="Узор на сейчас относительно карты" style="border-left:3px solid #7fb3d5">⟳ Транзиты</button><span style="display:inline-flex;gap:4px;align-items:center"><input id="godSol" placeholder="год" maxlength="4" style="width:52px" title="Пусто — действующий соляр"><button class="b" onclick="raskladka('solyar')" title="Карта года" style="border-left:3px solid #f0c040">☀ Соляр</button></span>
</div>
<div id="geo" style="display:none;padding:5px 12px;border-top:1px solid #2a3050;background:#10142a"></div>

<div class="irow">
  <span class="rlbl" style="color:#d08080">💞 ПАРТНЁР / СИНАСТРИЯ</span>
  <label>Имя</label><input class="w" id="pn" placeholder="Имя">
  <label>Дата</label><input id="pd" placeholder="ДД.ММ.ГГГГ">
  <label>Время</label><input id="pt" placeholder="ЧЧ:ММ:СС">
  <label>Страна</label><input id="pcn" placeholder="Страна" style="width:80px"><label>Область</label><input id="pcr" placeholder="Область" style="width:80px"><label>Район</label><input id="pcd" placeholder="Район" style="width:80px">
  <label>Город</label><input class="w" id="ppl" placeholder="Город / посёлок" oninput="this.dataset.tz=''">
  <button class="b" onclick="geoFind('pt')" title="Найти координаты">🔍</button>
  <label>GMT</label><input id="pz" placeholder="+ч" style="width:32px" title="Заполнится сам после 🔍 — историческое смещение на дату рождения">
  <label>Шир</label><input id="py" placeholder="широта" style="width:72px">
  <label>Долг</label><input id="px" placeholder="долгота" style="width:72px">
  <label>ASC</label><input id="pasc" placeholder="опц." style="width:58px">
  <button class="b" onclick="clearPartner()" title="Очистить партнёра + вернуть натал+транзит">✕</button>
  <button class="b bm" onclick="togglePartnerRing()" title="Показать кольцо партнёра от 0° Овна — ляжет ровно на родное синастрическое">🔵 Кольцо</button><button class="b bm" onclick="toggleUranSync()" title="Сдвинуть кольцо: Уран партнёра на мой Уран. Второй тык — обратно на 0° Овна">🔗 Уран-синхрон</button><button class="b bg" style="border-left:3px solid #d08080" onclick="showSynastry()">💞 Рассчитать синастрию</button><a class="b" href="/prognoz" style="border-left:3px solid #f0c040;color:#f0c040;text-decoration:none;padding:3px 12px" title="Космограмма и двенадцать глав суток от бегущего асцендента">🔮 Прогноз на день</a>
</div>
<div id="geoP" style="display:none;padding:5px 12px;border-top:1px solid #4a2a3a;background:#160f1a"></div>
</div>

<div id="chartWrap" style="position:relative"><button id="fsBtn" onclick="toggleFS()" title="На весь экран (Esc — закрыть)">⛶</button><div id="qtip"></div><div class="chart" id="wh"><div style="color:#3a3d50;padding:60px;text-align:center">Загрузка...</div></div></div>
<div class="tblk" id="kt"></div>
<div class="data">
  <div id="st" class="st">Нажми 🔮 Рассчитать</div>
  <div id="tl"></div>
  <div id="nd"></div>
  <div id="cd"></div>
</div>
<div id="fc"></div>
<script>
var QAPI=(location.protocol==='file:'?'http://localhost:8000':location.origin),TH='dark-high-contrast',timerOn=true,ti=null,li=null,natal=null,mode='natal';
function pInt(v){var n=parseInt(v,10);return isNaN(n)?null:n}
function gI(){var d=(document.getElementById('dt').value||'').split(/[.\-\/]+/),t=(document.getElementById('tm').value||'').split(/[.:\s]+/);return{year:pInt(d[2]),month:pInt(d[1]),day:pInt(d[0]),hour:pInt(t[0])||0,minute:pInt(t[1])||0,second:pInt(t[2])||0,timezone:parseFloat(document.getElementById('tz').value)||0,timezone_str:(document.getElementById('pl').dataset.tz||null),latitude:parseFloat(document.getElementById('la').value),longitude:parseFloat(document.getElementById('lo').value)}}
function chkI(d){if(d.year==null||d.month==null||d.day==null)return'Впиши дату рождения в формате ДД.ММ.ГГГГ';if(isNaN(d.latitude)||isNaN(d.longitude))return'Нет координат — нажми 🔍 или впиши широту и долготу';return null}
function gmtToTz(v){var n=parseInt(v)||0;return n>0?'Etc/GMT-'+n:(n<0?'Etc/GMT+'+(-n):'UTC')}
async function loadMatrix(){try{var o=await(await fetch(QAPI+'/operator')).json();var f={nm:o.name,dt:String(o.day).padStart(2,'0')+'.'+String(o.month).padStart(2,'0')+'.'+o.year,tm:String(o.hour).padStart(2,'0')+':'+String(o.minute).padStart(2,'0')+':'+String(Math.round(o.second)).padStart(2,'0'),pl:o.place,tz:(o.timezone>=0?'+':'')+o.timezone,la:String(o.latitude),lo:String(o.longitude)};for(var k in f){var el=document.getElementById(k);if(el)el.value=f[k]}document.getElementById('pl').dataset.tz=o.timezone_str||'';document.getElementById('st').textContent='Матрица возвращена с сервера: '+o.place+', '+f.tm;showNatal()}catch(e){document.getElementById('st').textContent='Матрица: '+e.message}}
function clearMe(){var _g=document.getElementById('geo');if(_g)_g.style.display='none';['nm','dt','tm','cn','cr','cd','pl','la','lo'].forEach(function(k){var el=document.getElementById(k);if(el)el.value=''});document.getElementById('tz').value='+0';document.getElementById('st').textContent='Поля очищены — введи данные другого человека и нажми Рассчитать'}
function clearPartner(){var _gp=document.getElementById('geoP');if(_gp)_gp.style.display='none';['pn','pd','pt','pcn','pcr','pcd','ppl','py','px','pasc'].forEach(function(k){var el=document.getElementById(k);if(el)el.value=''});document.getElementById('pz').value='';document.getElementById('ppl').dataset.tz='';setTimerOff();showNatal(false);document.getElementById('st').textContent='Партнёр очищён — чистый натал'}

async function geoNow(){var city=document.getElementById('tcity').value.trim();if(!city){document.getElementById('st').textContent='Впиши место где находишься';return}document.getElementById('st').textContent='Ищу «'+city+'»...';try{var r=await fetch(QAPI+'/geocode?city='+encodeURIComponent(city));if(!r.ok){document.getElementById('st').textContent='Не найдено: '+city+' — впиши координаты вручную';return}var j=await r.json();document.getElementById('tlat').value=j.latitude;document.getElementById('tlon').value=j.longitude;var off=j.utc_offset>=0?'+'+j.utc_offset:''+j.utc_offset;document.getElementById('tgmt').value=off;document.getElementById('tcity').dataset.tz=j.timezone_name;try{localStorage.setItem('qa_now',JSON.stringify({city:city,lat:j.latitude,lon:j.longitude,gmt:off}))}catch(e){}document.getElementById('st').textContent='Транзит по: '+j.address+' (GMT'+off+')';if(mode!=='synastry')showNatal()}catch(e){document.getElementById('st').textContent='Ошибка: '+e.message}}
function clearNow(){document.getElementById('tcity').value='';document.getElementById('tlat').value='';document.getElementById('tlon').value='';document.getElementById('tgmt').value='+0';document.getElementById('st').textContent='Место транзита очищено — впиши где находишься и нажми поиск'}
function setTimerOff(){timerOn=false;var l=document.getElementById('tlbl'),c=document.getElementById('tclk');if(l){l.textContent='⏱ OFF';l.className='toff';}if(c)c.className='toff';if(ti){clearInterval(ti);ti=null;}if(li){clearInterval(li);li=null;}if(window._ascRAF){cancelAnimationFrame(window._ascRAF);window._ascRAF=null;}}
async function geoFind(who){var cityId=who==='me'?'pl':'ppl',cnId=who==='me'?'cn':'pcn',crId=who==='me'?'cr':'pcr',cdId=who==='me'?'cd':'pcd',laId=who==='me'?'la':'py',loId=who==='me'?'lo':'px',tzId=who==='me'?'tz':'pz',dtId=who==='me'?'dt':'pd';var city=document.getElementById(cityId).value.trim(),country=document.getElementById(cnId).value.trim();var _v=function(i){var e=document.getElementById(i);return e&&e.value?e.value.trim():''};var _reg=_v(crId),_dis=_v(cdId);var cityQ=[city,_dis,_reg].filter(Boolean).join(', ');if(!city){document.getElementById('st').textContent='Впиши населённый пункт';return}
var _dp=(document.getElementById(dtId).value||'').split('.');var _od=(_dp.length===3)?(_dp[2]+'-'+String(_dp[1]).padStart(2,'0')+'-'+String(_dp[0]).padStart(2,'0')):'';
document.getElementById('st').textContent='Ищу «'+city+'»...';try{var r=await fetch(QAPI+'/geocode?city='+encodeURIComponent(cityQ)+'&country='+encodeURIComponent(country)+(_od?('&on_date='+_od):''));if(!r.ok){var e=await r.json();document.getElementById('st').textContent='Не найдено: '+(e.detail||city)+' — введи координаты вручную';return}var j=await r.json();j._asked={district:_dis,region:_reg,place:city};applyPlace(who,j,_od);}catch(e){document.getElementById('st').textContent='Ошибка поиска: '+e.message}}
function normPlace(x){return (x||'').toLowerCase().replace(/ё/g,'е')
 .replace(/район|ауданы|tumani|туман|область|облысы|viloyati|вилоят|округ|сельский|г\.|с\./g,'')
 .replace(/[^а-яa-z]/g,'').trim();}
function polarWarn(la){if(Math.abs(la)<=66.5)return '';
return '<div style="color:#ff4030;font-size:12px;font-weight:600;padding-top:4px">\u26a0 '+Math.abs(la).toFixed(2)+'\u00b0'+(la>0?'N':'S')+' \u2014 за полярным кругом. Плацидус здесь не строится. ДОМА ПО РЕГИОНМОНТАНУ.</div>';}
function explainDropped(j){var a=j.admin||{},ask=j._asked||{},o='';
function cmp(was,now,lbl){if(!was)return '';
 var A=normPlace(was),B=normPlace(now);
 if(!B)return '<span style="color:#e0a040;font-size:10px">\u26a0 «'+was+'» не найдено</span>';
 if(A&&B&&(A===B||A.indexOf(B)>=0||B.indexOf(A)>=0))return '';
 return '<span style="color:#e0a040;font-size:10px">\u26a0 «'+was+'» не найдено, возможно переименовано \u2192 '+now+'</span>';}
o+=cmp(ask.district,a.district,'Район');
o+=cmp(ask.region,a.region,'Область');
return o;}
function applyPlace(who,j,od){var laId=who==='me'?'la':'py',loId=who==='me'?'lo':'px',tzId=who==='me'?'tz':'pz',cityId=who==='me'?'pl':'ppl';
document.getElementById(laId).value=j.latitude;document.getElementById(loId).value=j.longitude;
var off=j.utc_offset>=0?'+'+j.utc_offset:''+j.utc_offset;document.getElementById(tzId).value=off;
document.getElementById(cityId).dataset.tz=j.timezone_name;
var h='<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">'
 +'<span style="color:#50c050;font-size:10px">\u2713</span>'
 +'<span style="color:#e0e4f0;font-size:12px;font-weight:600">'+j.address+'</span>'
 +'<span style="color:#7078a0;font-size:11px">'+j.latitude+' / '+j.longitude+'</span>'
 +'<span style="color:#e8c060;font-size:11px">GMT'+off+'</span>'
 +explainDropped(j)+'</div>'+polarWarn(j.latitude);
var g=document.getElementById(who==='me'?'geo':'geoP');g.innerHTML=h;g.style.display='block';
document.getElementById('st').textContent='Место: '+j.address+' (GMT'+off+')';}

var natalASC=0;
function liveColors(){var lt=document.body.classList.contains('lt');return{tr:lt?'#1560c0':'#4da6ff',pt:lt?'#d02828':'#ff6b6b',hit:lt?'#e00000':'#ff3030'}}
function toggleFS(){var w=document.getElementById('wh');if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}else{(w.requestFullscreen||w.webkitRequestFullscreen||function(){}).call(w);}}
function degToScreen(absDeg,R){var ang=(180+(absDeg-natalASC))%360;var rad=ang*Math.PI/180;return[240+R*Math.cos(rad),240-R*Math.sin(rad)]}

  if (_m) { var _d = new Date(Date.UTC(+_m[3], +_m[2] - 1, +_m[1], +_m[4], +_m[5], +_m[6]) + _g * 3600000); var _p = function (n) { return (n < 10 ? "0" : "") + n; };
    _мест = _p(_d.getUTCDate()) + "." + _p(_d.getUTCMonth() + 1) + "." + _d.getUTCFullYear() + " " + _p(_d.getUTCHours()) + ":" + _p(_d.getUTCMinutes()) + ":" + _p(_d.getUTCSeconds()) + " " + (_полеЗначение("tcity") || "местное") + " (GMT" + (_g >= 0 ? "+" : "") + _g + ")"; }
  if (заказ === "solyar") ш.push("соляр " + j.god + " · возвращение Солнца " + _мест + " · дома соляра на это место · расхождение " + j.rashozhdenie_sek + "″");
  else ш.push("транзиты на " + _мест);
  return ш.join(" · ");
}

async function raskladka(заказ) {
  var имя = _полеЗначение("nm");
  if (!имя) {
    var п = document.getElementById("nm");
    if (п) п.focus();
    document.getElementById("st").textContent =
      "Впишите имя — карта сохранится в архив под ним.";
    return;
  }
  var тело = {
    zakaz: заказ,
    imya: имя,
    data: _полеЗначение("dt"),
    vremya: _полеЗначение("tm"),
    mesto: _полеЗначение("pl"),
    shirota: parseFloat(_полеЗначение("la")),
    dolgota: parseFloat(_полеЗначение("lo")),
    gmt: parseFloat(_полеЗначение("tz")) || 0,
    seychas: {
      shirota: parseFloat(_полеЗначение("tlat")),
      dolgota: parseFloat(_полеЗначение("tlon")),
      gmt: parseFloat(_полеЗначение("tgmt")) || 0,
      mesto: _полеЗначение("tcity")
    }
  };
  if (заказ === "solyar") {
    var год = _полеЗначение("godSol");
    тело.god_solyara = год ? parseInt(год, 10) : null;
  }
  if (!тело.data || isNaN(тело.shirota)) {
    document.getElementById("st").textContent =
      "Заполните дату и место — нажмите 🔍 для координат.";
    return;
  }
  document.getElementById("st").textContent = "Считаю…";
  var шапкаКол = "";
  try {
    // ── 1. колесо: внутри натал/космограмма, снаружи кольцо момента ──
    mode = 'zakaz';   // таймер не трогаем: если бегущий АС включён — ляжет поверх новой карты сам
    var кол = await колесоЗаказа(телоКолеса(заказ));
    setWheel(кол.svg, false);
    if (!кол.vremya_izvestno) спрятатьДомаНаКолесе();
    селенаНаКолесе(кол.selena_natal, кол.selena_koltso, заказ === 'solyar' ? 'соляр' : 'сейчас');
    // дома, куспиды и углы КОЛЬЦА — красным слоем, тем же, что живые дома (для соляра это дома соляра на место «Я сейчас»)
    if (кол.kuspidy_koltsa && кол.kuspidy_koltsa.length === 12 && typeof drawLiveHouses === 'function') drawLiveHouses(кол.kuspidy_koltsa, { id: 'domaKoltsa', цвет: заказ === 'solyar' ? '#3ddc84' : '#ff8c1a', контур: true, подпись: заказ === 'solyar' ? 'дома соляра' : 'дома момента' });   // соляр — зелёный, транзиты — оранжевый; натал у Кериkeion жёлтый
    таблицыКерикеона(телоКолеса(заказ));   // таблицы Кериkeion к этой паре карт, в #kt
    шапкаКол = шапкаКолеса(кол, заказ);
    document.getElementById("st").textContent = шапкаКол + " · раскладка…";
  } catch (e) {
    document.getElementById("st").textContent = "Ошибка: " + e.message;
    return;
  }
  try {
    // ── 2. раскладка текстом под колесом ──
    var о = await fetch("/api/raschet", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(тело)
    });
    var д = await о.json();
    if (д.detail || д.oshibka) {
      var о_ = document.getElementById("rasklBlok");
      if (о_) { о_.style.display = "block";
        о_.innerHTML = '<div style="color:#e08060">Ошибка: ' +
          String(д.detail || д.oshibka).replace(/</g,"&lt;") + '</div>'; }
      document.getElementById("st").textContent = "Ошибка расчёта";
      return;
    }
    показатьРаскладку(д, заказ);
    document.getElementById("st").textContent =
      (заказ === "solyar" ? "Соляр готов" : "Транзиты готовы") + " · " + шапкаКол +
      (д.arhiv ? " · сохранено в архив" : "");
    обновитьСчётИстории();
  } catch (e) {
    document.getElementById("st").textContent = "Ошибка: " + e.message;
  }
}

function показатьРаскладку(д, заказ) {
  // ⚠️ 05.09: пишем в СВОЙ блок, а не в #kt — иначе затираются
  // таблицы натала, которые рисует старый код.
  var место = document.getElementById("rasklBlok");
  if (!место) return;
  место.style.display = "block";
  var шапка = д.shapka
    ? '<div style="color:#c9a961;font-size:12px;margin-bottom:10px">' + д.shapka + '</div>'
    : "";
  место.innerHTML = шапка +
    '<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">' +
      '<b style="color:#f0c040;font-size:12px;letter-spacing:1.4px">' +
        (заказ === "solyar" ? "КАРТА ГОДА" : "ГДЕ ТЫ СЕЙЧАС") + '</b>' +
      '<button class="b" onclick="копироватьРаскладку()">⧉ копировать</button>' +
      '<a class="b" href="/istoriya" style="text-decoration:none;padding:3px 12px">📜 в историю</a>' +
      '<button class="b" onclick="document.getElementById(\'rasklBlok\').style.display=\'none\'">✕</button>' +
    '</div>' +
    '<pre id="rasklPre" style="white-space:pre-wrap;word-break:break-word;' +
      'font:12px/1.65 ui-monospace,Menlo,Consolas,monospace;color:#c9c2b4;' +
      'max-height:70vh;overflow:auto;margin:0">' +
      д.polnyy_tekst.replace(/[&<>]/g, function(с){
        return {"&":"&amp;","<":"&lt;",">":"&gt;"}[с]; }) +
    '</pre>';
}

async function копироватьРаскладку() {
  var п = document.getElementById("rasklPre");
  if (!п) return;
  var т = п.textContent;
  var готово = function () { document.getElementById("st").textContent = "Скопировано (" + т.length + " знаков)"; };
  // 06.09: если буфер обмена закрыт (http, старый браузер) — запасной путь через выделение
  var запас = function () {
    try {
      var а = document.createElement("textarea"); а.value = т; а.style.position = "fixed"; а.style.opacity = "0";
      document.body.appendChild(а); а.select(); var ок = document.execCommand("copy"); document.body.removeChild(а);
      if (ок) готово(); else document.getElementById("st").textContent = "Не удалось скопировать — выдели текст мышкой";
    } catch (e) { document.getElementById("st").textContent = "Не удалось скопировать — выдели текст мышкой"; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(т).then(готово, запас);
  else запас();
}

async function обновитьСчётИстории() {
  try {
    var о = await fetch("/api/istoriya").then(function(r){ return r.json(); });
    var n = (о.raschety || []).length;
    var у = document.getElementById("istN");
    if (у) у.textContent = n ? "· " + n : "";
  } catch (e) { }
}
document.addEventListener("DOMContentLoaded", обновитьСчётИстории);
