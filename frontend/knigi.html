<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Книги Квантареона</title>
<style>
  :root { --bg:#12131a; --card:#1a1c26; --line:#2a2d3a; --ink:#e9e2d0; --dim:#8d8a7e; --gold:#c9993f; --red:#c0553f; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Segoe UI',system-ui,sans-serif; }
  .top { display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; flex-wrap:wrap; }
  .top h1 { margin:0 auto 0 0; font-size:14px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); font-weight:500; }
  .vkladki { display:flex; gap:8px; }
  .vk { padding:8px 18px; border:1px solid var(--line); border-radius:999px; color:var(--dim); font-size:13px; cursor:pointer; background:none; font-family:inherit; }
  .vk:hover { border-color:var(--gold); color:var(--ink); }
  .vk.on { border-color:var(--gold); color:#1a1533; background:linear-gradient(180deg,#f0d78c,#c9a95a); font-weight:600; }
  .b { display:inline-block; padding:7px 14px; border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none; font-size:12.5px; background:none; cursor:pointer; font-family:inherit; }
  .b:hover { border-color:var(--gold); }
  .b.red { color:var(--red); border-color:rgba(192,85,63,.45); }
  .zolotoy { background:linear-gradient(180deg,#f0d78c,#c9a95a); color:#1a1533; border:0; font-weight:600; padding:9px 20px; }
  .wrap { max-width:1000px; margin:0 auto; padding:22px 22px 60px; }

  /* клиенты */
  .schet { text-align:center; color:var(--dim); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:18px; }
  .schet b { color:var(--gold); font-size:15px; }
  .karta { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .verh { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .klyuch { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; color:var(--gold); letter-spacing:1px; }
  .tip { font-size:12.5px; color:var(--dim); }
  .data { margin-left:auto; font-size:12px; color:var(--dim); }
  .pochta { font-size:12.5px; opacity:.85; }
  .stranicy { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
  .stranicy a { font-size:12px; padding:5px 10px; border:1px solid var(--line); border-radius:7px; color:var(--ink); text-decoration:none; }
  .stranicy a:hover { border-color:var(--gold); color:var(--gold); }
  .pusto { text-align:center; color:var(--dim); padding:40px 0; font-size:13px; }

  /* кабинет */
  .blok { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px; }
  .blok h2 { margin:0 0 14px; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); font-weight:500; }
  label { display:block; font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); margin:12px 0 6px; }
  input, select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0f1017; color:var(--ink); font-size:14px; font-family:inherit; }
  input:focus, select:focus { outline:none; border-color:var(--gold); }
  .ryad { display:flex; gap:10px; flex-wrap:wrap; }
  .ryad > div { flex:1 1 170px; }
  .pw { position:relative; }
  .pw input { padding-right:44px; }
  .glaz { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:0; cursor:pointer; font-size:16px; opacity:.65; }
  .glaz:hover { opacity:1; }
  .otvet { margin-top:14px; font-size:13px; color:var(--gold); min-height:20px; }
  .otvet.err { color:var(--red); }
  .ramka { width:100%; height:70vh; margin-top:14px; border:1px solid var(--line); border-radius:10px; background:#0f1230; }
  .tochki::after { content:""; animation:t 1.5s steps(4) infinite; }
  @keyframes t { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""} }
  .malo { font-size:12px; color:var(--dim); margin-top:8px; line-height:1.5; }
  @media (max-width:640px) { .top h1 { width:100%; margin:0 0 6px; } }
</style>
</head>
<body>

<div class="top">
  <h1>Книги Квантареона</h1>
  <div class="vkladki">
    <button class="vk on" id="vkKlienty">Клиенты</button>
    <button class="vk" id="vkKabinet">Мой кабинет</button>
  </div>
  <a class="b" href="/istoriya">История разборов</a>
</div>

<div class="wrap">

  <!-- ВКЛАДКА 1 · КЛИЕНТЫ -->
  <section id="tabKlienty">
    <div class="schet"><b id="vsego">0</b> книг и разовых разборов</div>
    <div id="spisok"><div class="pusto">загружаю…</div></div>
  </section>

  <!-- ВКЛАДКА 2 · МОЙ КАБИНЕТ -->
  <section id="tabKabinet" hidden>
    <div class="blok">
      <h2>Пароль движка</h2>
      <div class="pw"><input id="pw" type="password" autocomplete="off" placeholder="нужен, чтобы выдавать ключи"><button class="glaz" id="glaz" type="button">👁</button></div>
      <div class="malo">Хранится только в этом браузере.</div>
    </div>

    <div class="blok">
      <h2>Выдать ключ</h2>
      <label for="mail">Почта покупателя</label>
      <input id="mail" type="email" autocomplete="off" placeholder="можно не заполнять">
      <div class="ryad">
        <div>
          <label for="tarif">Тариф</label>
          <select id="tarif"><option value="den">Разовый день</option><option value="shiv" selected>Книга (сшивание)</option></select>
        </div>
        <div>
          <label for="dney">Дней</label>
          <input id="dney" type="number" min="1" max="366" value="7">
        </div>
        <div>
          <label for="lang">Язык книги</label>
          <select id="lang"><option value="ru" selected>Русский</option><option value="en">English</option></select>
        </div>
      </div>
      <div style="margin-top:16px"><button class="b zolotoy" id="vydat">Выдать ключ</button></div>
      <div class="otvet" id="otvetV"></div>
    </div>

    <div class="blok">
      <h2>Опыт: построить разбор</h2>
      <label for="klyuch">Ключ</label>
      <input id="klyuch" class="klyuch" placeholder="QK-XXXX-XXXX-XXXX или QD-XXXX-XXXX" autocomplete="off">
      <div class="ryad">
        <div><label for="lat">Широта</label><input id="lat" type="number" step="0.01" value="56.85"></div>
        <div><label for="lon">Долгота</label><input id="lon" type="number" step="0.01" value="53.23"></div>
        <div><label for="tz">Пояс</label><input id="tz" type="number" step="1" value="4"></div>
      </div>
      <div class="malo">Место нужно только для первого дня — от него родится корень книги. Секунда — сейчас.</div>
      <div style="margin-top:16px">
        <button class="b zolotoy" id="postroit">Построить</button>
        <a class="b" id="skachat" href="#" download hidden style="margin-left:8px">Скачать файл</a>
      </div>
      <div class="otvet" id="otvetP"></div>
      <iframe class="ramka" id="ramka" hidden title="разбор"></iframe>
    </div>
  </section>

</div>

<script>
const $ = i => document.getElementById(i);
const э = т => String(т == null ? "" : т).replace(/[&<>"]/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[s]));
const ждать = мс => new Promise(r => setTimeout(r, мс));

/* ── вкладки ─────────────────────────────────────────────── */
function вкладка(имя) {
  const клиенты = имя === "klienty";
  $("tabKlienty").hidden = !клиенты;
  $("tabKabinet").hidden = клиенты;
  $("vkKlienty").classList.toggle("on", клиенты);
  $("vkKabinet").classList.toggle("on", !клиенты);
  try { localStorage.setItem("qn_vkladka", имя); } catch (e) {}
  if (клиенты) загрузить();
}
$("vkKlienty").addEventListener("click", () => вкладка("klienty"));
$("vkKabinet").addEventListener("click", () => вкладка("kabinet"));

/* ── вкладка КЛИЕНТЫ ─────────────────────────────────────── */
async function загрузить() {
  try {
    const о = await fetch("/api/istoriya").then(r => r.json());
    нарисовать(о.knigi || []);
  } catch (e) {
    $("spisok").innerHTML = '<div class="pusto">не вышло загрузить — обнови страницу</div>';
  }
}

function нарисовать(книги) {
  $("vsego").textContent = книги.length;
  const м = $("spisok");
  if (!книги.length) { м.innerHTML = '<div class="pusto">клиентов пока нет</div>'; return; }
  м.innerHTML = книги.map(б => `
    <div class="karta" data-klyuch="${э(б.klyuch)}">
      <div class="verh">
        <span class="klyuch">${э(б.klyuch)}</span>
        <span class="tip">${б.tarif === "shiv" ? "книга · " + э(б.dney) + " дн." : "разовый день"}${б.koren ? " · корень " + э(б.koren) : ""}</span>
        ${б.pochta ? `<span class="pochta">${э(б.pochta)}</span>` : ""}
        <span class="data">${э(б.sozdan)}</span>
        <button class="b red ubrat" title="убрать">🗑</button>
      </div>
      <div class="stranicy">
        ${б.stranicy.length
          ? б.stranicy.map(с => `<a href="/istoriya/karta?f=${encodeURIComponent(с.fayl_karty)}" target="_blank" rel="noopener">стр. ${с.n} · ${э(с.data)} · ${э(с.asc)}</a>`).join("")
          : '<span class="tip">страниц ещё нет</span>'}
      </div>
    </div>`).join("");
  м.querySelectorAll(".ubrat").forEach(к => к.addEventListener("click", убрать));
}

async function убрать(е) {
  const карта = е.target.closest(".karta"), ключ = карта.dataset.klyuch;
  if (!confirm("Убрать " + ключ + " со всеми страницами?\nЭто навсегда.")) return;
  е.target.disabled = true;
  try {
    const о = await fetch("/api/kniga/udalit", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ klyuch: ключ })
    }).then(r => r.json());
    if (о.ok) карта.remove(); else { alert("не вышло убрать"); е.target.disabled = false; }
  } catch (ex) { alert("не вышло убрать"); е.target.disabled = false; }
  $("vsego").textContent = document.querySelectorAll(".karta").length;
}

/* ── вкладка МОЙ КАБИНЕТ ─────────────────────────────────── */
const П = "qn_kabinet_pw";
try { const с = localStorage.getItem(П); if (с) $("pw").value = с; } catch (e) {}
$("pw").addEventListener("change", () => { try { localStorage.setItem(П, $("pw").value); } catch (e) {} });
$("glaz").addEventListener("click", () => { const п = $("pw"); п.type = п.type === "password" ? "text" : "password"; });

$("vydat").addEventListener("click", async () => {
  const о = $("otvetV"); о.className = "otvet"; о.textContent = "…";
  try {
    const д = await fetch("/api/kniga/vydat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        klyuch_hozyaina: $("pw").value, pochta: $("mail").value.trim(),
        tarif: $("tarif").value, dney: parseInt($("dney").value || "1", 10), lang: $("lang").value
      })
    }).then(r => r.json());
    if (!д.ok) { о.className = "otvet err"; о.textContent = д.reason === "locked" ? "Пароль не подошёл" : "Не вышло выдать"; return; }
    о.innerHTML = 'Ключ выдан: <span class="klyuch">' + д.klyuch + "</span>" + (д.pismo ? " · письмо ушло ✉" : " · без письма");
    $("klyuch").value = д.klyuch;
  } catch (e) { о.className = "otvet err"; о.textContent = "Связь прервалась"; }
});

$("postroit").addEventListener("click", async () => {
  const о = $("otvetP"), ключ = ($("klyuch").value || "").trim().toUpperCase();
  о.className = "otvet"; $("ramka").hidden = true; $("skachat").hidden = true;
  if (!/^Q[DK](-[A-Z2-9]{4}){2,3}$/.test(ключ)) { о.className = "otvet err"; о.textContent = "Впиши ключ"; return; }
  о.innerHTML = 'Квантареон работает<span class="tochki"></span>';
  try {
    const r = await fetch("/api/kniga/stranica", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        klyuch: ключ, iso: new Date().toISOString(),
        lat: parseFloat($("lat").value), lon: parseFloat($("lon").value), tz: parseFloat($("tz").value)
      })
    }).then(x => x.json());
    if (!r.ok) {
      о.className = "otvet err";
      о.textContent = r.reason === "istek" ? "Срок книги вышел" : r.reason === "busy" ? "Движок занят — попробуй через минуту"
        : (r.reason === "no_key" || r.reason === "bad_key") ? "Такого ключа нет" : "Не вышло: " + r.reason;
      return;
    }
    if (r.gotovo) { показать(r.html, r.n, ключ); return; }
    for (let i = 0; i < 200; i++) {
      await ждать(3000);
      const c = await fetch("/api/karta-dnya/status?nomer=" + r.nomer).then(x => x.json());
      if (c.oshibka) { о.className = "otvet err"; о.textContent = "Ошибка: " + c.oshibka; return; }
      if (c.gotovo) { показать(c.html, r.n, ключ); return; }
      if (c.etap) о.innerHTML = э(c.etap) + '<span class="tochki"></span>';
    }
    о.className = "otvet err"; о.textContent = "Слишком долго — посмотри во вкладке «Клиенты»";
  } catch (e) { о.className = "otvet err"; о.textContent = "Связь прервалась"; }
});

function показать(html, n, ключ) {
  $("otvetP").textContent = "Готово · страница " + n;
  $("ramka").hidden = false; $("ramka").srcdoc = html;
  const b = new Blob([html], { type: "text/html" });
  const s = $("skachat"); s.hidden = false; s.href = URL.createObjectURL(b);
  s.download = "quantareon-" + ключ + "-" + n + ".html";
}

/* открываем ту вкладку, на которой были в прошлый раз */
let старт = "klienty";
try { старт = localStorage.getItem("qn_vkladka") || "klienty"; } catch (e) {}
вкладка(старт);
</script>
</body>
</html>
