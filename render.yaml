services:
  - type: web
    name: quantareon-astro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QUANTAREON_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
